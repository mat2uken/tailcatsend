[workspace]
resolver = "2"
members = [
    "crates/tailsend-protocol",
    "crates/tailsend-transport-api",
    "crates/tailsend-platform-api",
    "crates/tailsend-transfer",
    "crates/tailsend-core",
    "crates/tailsend-qr",
    "crates/tailsend-ui-controller",
    "apps/desktop",
    "apps/web",
    "apps/ios",
    "apps/android",
]

[workspace.dependencies]
# Internal crates
tailsend-protocol = { path = "crates/tailsend-protocol" }
tailsend-transport-api = { path = "crates/tailsend-transport-api" }
tailsend-platform-api = { path = "crates/tailsend-platform-api" }
tailsend-transfer = { path = "crates/tailsend-transfer" }
tailsend-core = { path = "crates/tailsend-core" }
tailsend-qr = { path = "crates/tailsend-qr" }
tailsend-ui-controller = { path = "crates/tailsend-ui-controller" }

# Slint
slint = { version = "1.17.1", default-features = false }

# Async & Serialization
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2.6"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
bytes = "1.10"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.43", features = ["full"] }

# WASM dependencies
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Location",
    "History",
    "Navigator",
    "Clipboard",
    "File",
    "Blob",
    "ReadableStream",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "DecompressionStream",
    "Response",
    "HtmlInputElement",
    "FileList",
] }

# QR code
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
[profile.release]
opt-level = 0
