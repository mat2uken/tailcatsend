[workspace]
resolver = "2"
members = [
    "crates/tailsend-protocol",
    "crates/tailsend-transport-api",
    "crates/tailsend-platform-api",
    "crates/tailsend-transfer",
    "crates/tailsend-core",
    "crates/tailsend-qr",
    "crates/tailsend-ui-controller",
    "crates/tailsend-telemetry",
    "crates/tailsend-updates",
    "crates/tailsend-native-bridge",
    "apps/desktop",
    "apps/web",
    "apps/ios",
    "apps/android",
 ]

# winit 0.30.13 only implements UIKeyInput on iOS, which silently drops
# every keypress from multi-stage IMEs (Japanese kana / flick, pinyin,
# hangul...). vendor/winit applies winit PR #4592, which adopts
# UITextInput so CJK keyboards can type into Slint text inputs.
[patch.crates-io]
winit = { path = "vendor/winit" }

[workspace.dependencies]
# Internal crates
tailsend-protocol = { path = "crates/tailsend-protocol" }
tailsend-transport-api = { path = "crates/tailsend-transport-api" }
tailsend-platform-api = { path = "crates/tailsend-platform-api" }
tailsend-transfer = { path = "crates/tailsend-transfer" }
tailsend-core = { path = "crates/tailsend-core" }
tailsend-qr = { path = "crates/tailsend-qr" }
tailsend-ui-controller = { path = "crates/tailsend-ui-controller" }
tailsend-telemetry = { path = "crates/tailsend-telemetry" }
tailsend-updates = { path = "crates/tailsend-updates" }
tailsend-native-bridge = { path = "crates/tailsend-native-bridge" }

# Slint
slint = { version = "1.17.1", default-features = false }

# Async & Serialization
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2.6"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
bytes = "1.10"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.43", features = ["full"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

# WASM dependencies
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Location",
    "History",
    "Navigator",
    "Clipboard",
    "File",
    "Blob",
    "ReadableStream",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "DecompressionStream",
    "Response",
    "HtmlInputElement",
    "FileList",
] }

# QR code
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Android release for Crashlytics: keeps the ELF symbol table so the
# firebase-crashlytics-gradle plugin can upload native symbols from
# target/aarch64-linux-android/release-native/.
[profile.release-native]
inherits = "release"
strip = "none"
