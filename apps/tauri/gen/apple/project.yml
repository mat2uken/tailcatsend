name: tailsend-tauri
options:
  bundleIdPrefix: jp.yasagure.ponlet
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Ponlet
      PRODUCT_BUNDLE_IDENTIFIER: jp.yasagure.ponlet
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  tailsend-tauri_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: tailsend-tauri_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: tailsend-tauri_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Ponlet uses the camera to scan invitation QR codes and connect to another device.
        NSLocalNetworkUsageDescription: Ponlet uses the local network for direct device connections and file transfers.
        NSBonjourServices: [_tailsend._tcp, _tailsend._udp]
        ITSAppUsesNonExemptEncryption: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseCrashlyticsCollectionEnabled: false
        UILaunchStoryboardName: LaunchScreen
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: jp.yasagure.ponlet.share.k7vnga9k78
            CFBundleURLSchemes: [ponlet]
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.14
        CFBundleVersion: "1.0.14"
    entitlements:
      path: tailsend-tauri_iOS/tailsend-tauri_iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.yasagure.ponlet.k7vnga9k78
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/.swift-products/$(PLATFORM_NAME)/$(CONFIGURATION)
        OTHER_LDFLAGS: [$(inherited), -ltailcat, -ObjC, -framework, FirebaseAnalytics, -framework, GoogleAppMeasurement, -framework, GoogleAppMeasurementIdentitySupport, -framework, GoogleAdsOnDeviceConversion]
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - target: PonletShareExtension
        embed: true
    preBuildScripts:
      - script: cargo tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
    postBuildScripts:
      - script: bash "${PROJECT_DIR}/../../../../scripts/copy_ios_swift_bundles.sh"
        name: Copy Swift Package Bundles
        basedOnDependencyAnalysis: false

  PonletShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Ponlet
        NSLocalNetworkUsageDescription: Ponlet connects to your other device to send the shared items.
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: 1.0.14
        CFBundleVersion: "1.0.14"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    entitlements:
      path: ShareExtension/PonletShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.yasagure.ponlet.k7vnga9k78
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.yasagure.ponlet.share.k7vnga9k78
        PRODUCT_NAME: PonletShareExtension
        SWIFT_VERSION: 5.0
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: ShareExtension/ShareSession.h
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION)
        OTHER_LDFLAGS: [$(inherited), -lponlet_share_session, -ltailcat, -lresolv]
        SKIP_INSTALL: YES
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
