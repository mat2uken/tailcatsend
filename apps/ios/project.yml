name: TailSend
options:
  bundleIdPrefix: dev.tailsend
  xcodeVersion: "15.4"
  provisioningStyle: Manual
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 12.0.0
targets:
  TailSend:
    type: application
    platform: iOS
    sources:
      - path: TailSend
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
    postBuildScripts:
      - name: Upload dSYM to Crashlytics
        script: |
          if [ "$CONFIGURATION" == "Release" ]; then
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run" \
          -gsp "$SRCROOT/TailSend/GoogleService-Info.plist" \
          -p ios \
          "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          fi
        inputFiles:
          - $(SRCROOT)/TailSend/GoogleService-Info.plist
        basedOnDependencyAnalysis: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: jp.yasagure.ponlet
      # XcodeGen expands ${VAR} at generation time (no ":-" default
      # syntax); unset values are overridden on the xcodebuild command
      # line. PROVISIONING_PROFILE_SPECIFIER must stay on the TailSend
      # target only: newer Xcode rejects archives when it leaks to SPM
      # package targets ("does not support provisioning profiles").
      DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
      CODE_SIGN_STYLE: Manual
      PROVISIONING_PROFILE_SPECIFIER: ${PROVISIONING_PROFILE_SPECIFIER}
      "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
      INFOPLIST_FILE: TailSend/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_OBJC_BRIDGING_HEADER: TailSend/TailSend-Bridging-Header.h
      SWIFT_VERSION: "5.0"
      "ONLY_ACTIVE_ARCH[config=Debug]": YES
      "ONLY_ACTIVE_ARCH[config=Release]": NO
      ARCHS:
        - arm64
      "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
        - $(SRCROOT)/../../target/aarch64-apple-ios/release
        - $(SRCROOT)/../..
      "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
        - $(SRCROOT)/../../target/aarch64-apple-ios-sim/release
        - $(SRCROOT)/../..
      "OTHER_LDFLAGS[sdk=iphoneos*]":
        - -ltailsend_ios
        - -ltailcat_ios
        - -framework UIKit
        - -framework AVFoundation
        - -framework Metal
        - -framework QuartzCore
        - -framework CoreGraphics
        - -framework CoreText
        - -framework Security
        - -framework Foundation
        - -framework Network
        - -lresolv
        - -lc++
      "OTHER_LDFLAGS[sdk=iphonesimulator*]":
        - -ltailsend_ios
        - -ltailcat_ios_sim
        - -framework UIKit
        - -framework AVFoundation
        - -framework Metal
        - -framework QuartzCore
        - -framework CoreGraphics
        - -framework CoreText
        - -framework Security
        - -framework Foundation
        - -framework Network
        - -lresolv
        - -lc++
