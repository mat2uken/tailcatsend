name: TailSend
options:
  bundleIdPrefix: dev.tailsend
  deploymentTarget:
    iOS: "17.0"
targets:
  TailSend:
    type: application
    platform: iOS
    sources:
      - path: TailSend
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.tailsend.app
      DEVELOPMENT_TEAM: [REDACTED_TEAM_ID]
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: TailSend/Info.plist
      SWIFT_OBJC_BRIDGING_HEADER: TailSend/TailSend-Bridging-Header.h
      SWIFT_VERSION: "5.0"
      ONLY_ACTIVE_ARCH: YES
      ARCHS:
        - arm64
      "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
        - $(SRCROOT)/../../target/aarch64-apple-ios/release
        - $(SRCROOT)/../..
      "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
        - $(SRCROOT)/../../target/aarch64-apple-ios-sim/release
        - $(SRCROOT)/../..
      "OTHER_LDFLAGS[sdk=iphoneos*]":
        - -ltailsend_ios
        - -ltailcat_ios
        - -framework UIKit
        - -framework AVFoundation
        - -framework Metal
        - -framework QuartzCore
        - -framework CoreGraphics
        - -framework CoreText
        - -framework Security
        - -framework Foundation
        - -framework Network
        - -lresolv
        - -lc++
      "OTHER_LDFLAGS[sdk=iphonesimulator*]":
        - -ltailsend_ios
        - -ltailcat_ios_sim
        - -framework UIKit
        - -framework AVFoundation
        - -framework Metal
        - -framework QuartzCore
        - -framework CoreGraphics
        - -framework CoreText
        - -framework Security
        - -framework Foundation
        - -framework Network
        - -lresolv
        - -lc++
