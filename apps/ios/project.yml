name: TailSend
options:
  bundleIdPrefix: dev.tailsend
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"
targets:
  TailSend:
    type: application
    platform: iOS
    sources:
      - path: TailSend
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: jp.yasagure.ponlet
      DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM:-}
      CODE_SIGN_STYLE: ${CODE_SIGN_STYLE:-Manual}
      PROVISIONING_PROFILE_SPECIFIER: ${PROVISIONING_PROFILE_SPECIFIER:-}
      "CODE_SIGN_IDENTITY[sdk=iphoneos*]": ${CODE_SIGN_IDENTITY:-Apple Distribution}
      INFOPLIST_FILE: TailSend/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_OBJC_BRIDGING_HEADER: TailSend/TailSend-Bridging-Header.h
      SWIFT_VERSION: "5.0"
      "ONLY_ACTIVE_ARCH[config=Debug]": YES
      "ONLY_ACTIVE_ARCH[config=Release]": NO
      ARCHS:
        - arm64
      "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
        - $(SRCROOT)/../../target/aarch64-apple-ios/release
        - $(SRCROOT)/../..
      "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
        - $(SRCROOT)/../../target/aarch64-apple-ios-sim/release
        - $(SRCROOT)/../..
      "OTHER_LDFLAGS[sdk=iphoneos*]":
        - -ltailsend_ios
        - -ltailcat_ios
        - -framework UIKit
        - -framework AVFoundation
        - -framework Metal
        - -framework QuartzCore
        - -framework CoreGraphics
        - -framework CoreText
        - -framework Security
        - -framework Foundation
        - -framework Network
        - -lresolv
        - -lc++
      "OTHER_LDFLAGS[sdk=iphonesimulator*]":
        - -ltailsend_ios
        - -ltailcat_ios_sim
        - -framework UIKit
        - -framework AVFoundation
        - -framework Metal
        - -framework QuartzCore
        - -framework CoreGraphics
        - -framework CoreText
        - -framework Security
        - -framework Foundation
        - -framework Network
        - -lresolv
        - -lc++
