[package]
name = "tailsend-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
tailsend-core = { workspace = true }
tailsend-protocol = { workspace = true }
tailsend-transport-api = { workspace = true }
tailsend-platform-api = { workspace = true }
tailsend-transfer = { workspace = true }
tailsend-ui-controller = { workspace = true }
tailsend-qr = { workspace = true }
tailsend-telemetry = { workspace = true }
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg", "std", "compat-1-2"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
log = { workspace = true }
getrandom = { workspace = true }
console_error_panic_hook = "0.1"

[build-dependencies]
slint-build = { version = "1.17.1" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

