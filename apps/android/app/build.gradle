plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// google-services.json が存在する場合のみ Firebase 関連プラグインを適用する。
// 無い場合(CI / ローカル)でもビルドは通り、ランタイム側はテレメトリが
// no-op になる。雛形は google-services.json.example を参照。
def googleServicesJson = file('google-services.json')
def hasGoogleServices = googleServicesJson.exists()

if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    logger.warn('google-services.json not found; google-services / crashlytics plugins are skipped.')
}

android {
    namespace 'jp.yasagure.ponlet'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "jp.yasagure.ponlet"
        minSdk 31
        targetSdk 36
        versionCode Integer.parseInt(findProperty('VERSION_CODE') ?: System.getenv('VERSION_CODE') ?: '1')
        versionName findProperty('VERSION_NAME') ?: System.getenv('VERSION_NAME') ?: '1.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def ksFile = findProperty('KEYSTORE_FILE') ?: System.getenv('KEYSTORE_FILE') ?: '../../build/certs/ponlet-release.keystore'
            if (file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword findProperty('KEYSTORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD') ?: ''
                keyAlias findProperty('KEY_ALIAS') ?: System.getenv('KEY_ALIAS') ?: 'ponlet'
                keyPassword findProperty('KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release

            if (hasGoogleServices) {
                // CI が cargo でビルドした strip 前 .so を jniLibs に置くため、
                // そこを unstrippedNativeLibsDir に指定する。libtailcat_android.so
                // も同じディレクトリに置かれるので両方のシンボルがアップロード対象
                // になる。ディレクトリが無い場合(Rust を先にビルドしていないローカル
                // 等の単独 gradle ビルド)は無効のままにしてビルドを失敗させない。
                def unstrippedDir = file('src/main/jniLibs')
                firebaseCrashlytics {
                    nativeSymbolUploadEnabled unstrippedDir.exists()
                    if (unstrippedDir.exists()) {
                        unstrippedNativeLibsDir unstrippedDir
                    }
                }
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

// CI (google_play.yml) は `gradle :app:bundleRelease` 一発でビルドするため、
// バンドル後にネイティブシンボルのアップロードが走るようここで接続する。
// upload タスクは google-services.json + jniLibs が揃った時だけ存在する。
afterEvaluate {
    def uploadTask = tasks.findByName('uploadCrashlyticsSymbolFileRelease')
    def bundleTask = tasks.findByName('bundleRelease')
    if (uploadTask != null && bundleTask != null) {
        bundleTask.finalizedBy uploadTask
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
    implementation 'com.google.firebase:firebase-config'
}
