<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TailSend — Direct P2P Transfer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas, #canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            display: block !important;
            touch-action: none;
            background-color: #0f172a;
        }
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s ease-out;
            padding: 20px;
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            font-size: 14px;
            color: #94a3b8;
            word-break: break-all;
            max-width: 90vw;
        }
        #debug-log {
            margin-top: 15px;
            font-size: 11px;
            color: #ef4444;
            max-width: 90vw;
            word-break: break-all;
            font-family: monospace;
        }

        /* Floating iOS / Native Progress HUD */
        #transfer-hud {
            display: none;
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 400px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 16px;
            z-index: 9999;
            flex-direction: column;
            gap: 8px;
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideDown {
            from { transform: translate(-50%, -20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        #transfer-hud.completed {
            border-color: rgba(34, 197, 94, 0.4);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(34, 197, 94, 0.2);
        }
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }
        .hud-status {
            color: #6366f1;
        }
        #transfer-hud.completed .hud-status {
            color: #22c55e;
        }
        .hud-percent {
            color: #f8fafc;
            font-variant-numeric: tabular-nums;
        }
        .hud-file {
            font-size: 14px;
            font-weight: 500;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hud-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hud-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 3px;
            transition: width 0.1s linear;
        }
        #transfer-hud.completed .hud-bar-fill {
            background: #22c55e;
        }
        .hud-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
    <script src="./assets/wasm_exec.js?v=20260902_3"></script>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="title">TailSend</div>
        <div class="status" id="status">Loading TailSend...</div>
        <div id="debug-log"></div>
    </div>

    <!-- Floating Native Progress HUD -->
    <div id="transfer-hud">
        <div class="hud-header">
            <span class="hud-status" id="hud-status">Sending...</span>
            <span class="hud-percent" id="hud-percent">0%</span>
        </div>
        <div class="hud-file" id="hud-file">filename.mp4</div>
        <div class="hud-bar-bg">
            <div class="hud-bar-fill" id="hud-bar-fill"></div>
        </div>
        <div class="hud-footer">
            <span id="hud-bytes">0.0 MB / 0.0 MB</span>
            <span id="hud-speed">0.0 MB/s</span>
        </div>
    </div>

    <canvas id="canvas"></canvas>
    <input type="file" id="global-file-picker" style="position:fixed;top:-1000px;left:-1000px;opacity:0;pointer-events:none;" />

    <script type="module">
        const statusEl = document.getElementById("status");
        const loaderEl = document.getElementById("loader");
        const debugEl = document.getElementById("debug-log");
        const hudEl = document.getElementById("transfer-hud");
        const hudStatusEl = document.getElementById("hud-status");
        const hudPercentEl = document.getElementById("hud-percent");
        const hudFileEl = document.getElementById("hud-file");
        const hudBarFillEl = document.getElementById("hud-bar-fill");
        const hudBytesEl = document.getElementById("hud-bytes");
        const hudSpeedEl = document.getElementById("hud-speed");
        const BUILD_TIMESTAMP = Date.now();

        window.lastReceivedMessage = "";

        function updateStatus(msg) {
            if (statusEl) statusEl.textContent = msg;
            console.log("[TailSend Loader]", msg);
        }

        function showDebugError(err) {
            console.error("[TailSend Debug]", err);
            if (debugEl) {
                debugEl.textContent = "Error: " + (err.message || String(err));
            }
        }

        window.addEventListener("error", (e) => showDebugError(e.error || e.message));
        window.addEventListener("unhandledrejection", (e) => showDebugError(e.reason));

        function hideLoader() {
            if (loaderEl) {
                loaderEl.style.opacity = "0";
                setTimeout(() => {
                    if (loaderEl && loaderEl.parentNode) {
                        loaderEl.parentNode.removeChild(loaderEl);
                    }
                }, 300);
            }
        }

        let hudDismissTimer = null;
        function updateHUD(visible, status, filename, bytesText, progress, speed, isComplete = false) {
            if (!hudEl) return;
            if (hudDismissTimer) {
                clearTimeout(hudDismissTimer);
                hudDismissTimer = null;
            }

            if (visible) {
                hudEl.classList.remove("completed");
                hudEl.style.display = "flex";
                if (hudStatusEl) hudStatusEl.textContent = status;
                if (hudPercentEl) hudPercentEl.textContent = Math.round(progress * 100) + "%";
                if (hudFileEl) hudFileEl.textContent = filename;
                if (hudBarFillEl) hudBarFillEl.style.width = Math.min(100, Math.round(progress * 100)) + "%";
                if (hudBytesEl) hudBytesEl.textContent = bytesText;
                if (hudSpeedEl) hudSpeedEl.textContent = speed;
            } else if (isComplete) {
                hudEl.classList.add("completed");
                if (hudStatusEl) hudStatusEl.textContent = "[Completed] Transfer Successful!";
                if (hudPercentEl) hudPercentEl.textContent = "100%";
                if (hudBarFillEl) hudBarFillEl.style.width = "100%";
                if (hudSpeedEl) hudSpeedEl.textContent = "Saved";

                hudDismissTimer = setTimeout(() => {
                    if (hudEl) {
                        hudEl.style.display = "none";
                        hudEl.classList.remove("completed");
                    }
                }, 3500);
            } else {
                hudEl.style.display = "none";
            }
        }

        async function fetchAndDecompressWasmBytes(url) {
            const cacheBustedUrl = url.includes("?") ? `${url}&_cb=${BUILD_TIMESTAMP}` : `${url}?_cb=${BUILD_TIMESTAMP}`;
            const response = await fetch(cacheBustedUrl, { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} while fetching ${cacheBustedUrl}`);
            }
            if (url.endsWith(".gz") && typeof DecompressionStream !== "undefined") {
                const decompressedStream = response.body.pipeThrough(new DecompressionStream("gzip"));
                const blob = await new Response(decompressedStream).blob();
                return await blob.arrayBuffer();
            }
            return await response.arrayBuffer();
        }

        const CHUNK_SIZE = 64 * 1024; // 64 KiB
        let targetHostAddr = "";

        function getHostAddress() {
            if (window.hostTailcatAddress && window.hostTailcatAddress.length > 5) {
                return window.hostTailcatAddress;
            }
            if (targetHostAddr && targetHostAddr.length > 5 && !targetHostAddr.startsWith("p2Ex")) {
                return targetHostAddr;
            }

            // Fallback: Extract from URL
            const hash = window.location.hash || "";
            const match = hash.match(/i=([^&]+)/);
            if (match) {
                const token = match[1];
                try {
                    let base64 = token.replace(/-/g, '+').replace(/_/g, '/');
                    while (base64.length % 4) base64 += '=';
                    const binary = atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

                    // Scan for UTF-8 string following CBOR key 3 ('\x03')
                    for (let i = 0; i < bytes.length - 8; i++) {
                        if (bytes[i] === 3 && (bytes[i + 1] >= 0x60 && bytes[i + 1] <= 0x7b)) {
                            let len = 0;
                            let start = 0;
                            if (bytes[i + 1] <= 0x77) {
                                len = bytes[i + 1] - 0x60;
                                start = i + 2;
                            } else if (bytes[i + 1] === 0x78) {
                                len = bytes[i + 2];
                                start = i + 3;
                            } else if (bytes[i + 1] === 0x79) {
                                len = (bytes[i + 2] << 8) | bytes[i + 3];
                                start = i + 4;
                            }
                            if (len > 0 && start + len <= bytes.length) {
                                const decoder = new TextDecoder('utf-8');
                                const addr = decoder.decode(bytes.slice(start, start + len));
                                if (addr.length > 5) {
                                    targetHostAddr = addr;
                                    return addr;
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn("[TailSend Web] CBOR scan failed:", e);
                }
            }
            return targetHostAddr || "";
        }

        // Send Initial Direct P2P Handshake to Host
        async function sendInitialP2PHandshake() {
            const addr = getHostAddress();
            if (!addr || !window.tailcatDial) {
                console.warn("[TailSend Web] Host address or tailcatDial not yet available for handshake:", addr);
                return;
            }
            try {
                console.log("[TailSend Web] Connecting initial P2P handshake to Host:", addr);
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("Connecting to macOS Host via WireGuard P2P...");
                }
                const conn = await window.tailcatDial({
                    addr: addr,
                    port: 101,
                    derpMapURL: "https://tailcat.dev/derpmap.json"
                });
                const encoder = new TextEncoder();
                await conn.write(encoder.encode("🤝 [Connected] Mobile Web Client connected via Tailcat WireGuard P2P!"));
                await conn.closeWrite();
                conn.close();
                console.log("✅ [TailSend Web] Direct P2P Handshake successfully delivered to Mac!");
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("Connected to macOS Host via Pure Tailcat P2P!");
                }
            } catch (err) {
                console.warn("[TailSend Web] Handshake notice:", err);
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("Ready (WireGuard P2P)");
                }
            }
        }

        // Host Mode: Start Tailcat WireGuard Listener and notify Slint to render QR Code
        async function startHostListenerAndGenerateQR() {
            try {
                console.log("[TailSend Web] Host Mode: Starting Tailcat WireGuard listener...");
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("Starting Tailcat WireGuard Mesh (Tokyo Region 304)...");
                }
                const listener = await window.tailcatListen({
                    derpMapURL: "https://tailcat.dev/derpmap.json",
                    onConnection: (conn) => {
                        console.log("⚡ [TailSend Web] Incoming WireGuard P2P connection from peer!", conn);
                        handleIncomingP2PConnection(conn);
                    }
                });

                console.log("⚡ [TailSend Web] Tailcat host address acquired:", listener.address);
                window.hostTailcatAddress = listener.address;

                if (window.onTailcatHostAddressReady) {
                    window.onTailcatHostAddressReady(listener.address);
                }
            } catch (err) {
                console.error("[TailSend Web] Failed to start Tailcat listener:", err);
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("Listener Error: " + (err.message || err));
                }
            }
        }

        // Handle incoming connection when acting as Host
        async function handleIncomingP2PConnection(conn) {
            try {
                if (conn.port === 101) {
                    let text = "";
                    const decoder = new TextDecoder();
                    while (true) {
                        const chunk = await conn.read();
                        if (!chunk || chunk.length === 0) break;
                        text += decoder.decode(chunk, { stream: true });
                    }
                    text += decoder.decode();
                    conn.close();
                    console.log("⚡ [TailSend Web] Received text on Port 101:", text);

                    if (window.onPeerConnectedSlint) {
                        window.onPeerConnectedSlint("Remote Peer (P2P)");
                    }
                    if (text.startsWith("🤝")) {
                        if (window.updateSlintStatusText) {
                            window.updateSlintStatusText("Remote peer connected via WireGuard P2P!");
                        }
                    } else if (text.trim().length > 0) {
                        window.lastReceivedMessage = text;
                        if (window.onIncomingTextMessageSlint) {
                            window.onIncomingTextMessageSlint(text);
                        }
                    }
                } else if (conn.port === 102) {
                    await handleIncomingFileStream(conn);
                }
            } catch (err) {
                console.error("[TailSend Web] Incoming connection error:", err);
            }
        }

        // Receive File Stream on Port 102
        async function handleIncomingFileStream(conn) {
            let filename = "received_file.bin";
            let totalBytes = 0;
            let receivedBytes = 0;
            let fileData = [];

            let headerBuffer = "";
            const decoder = new TextDecoder();
            let headerParsed = false;
            let startTime = performance.now();

            if (window.onPeerConnectedSlint) {
                window.onPeerConnectedSlint("Remote Peer (P2P)");
            }

            while (true) {
                const chunk = await conn.read();
                if (!chunk || chunk.length === 0) break;

                if (!headerParsed) {
                    headerBuffer += decoder.decode(chunk, { stream: true });
                    const newlineIdx = headerBuffer.indexOf("\n");
                    if (newlineIdx !== -1) {
                        const headerLine = headerBuffer.substring(0, newlineIdx).trim();
                        const parts = headerLine.split(":");
                        if (parts.length >= 3 && parts[0] === "NAME") {
                            filename = parts[1];
                            totalBytes = parseInt(parts[2], 10) || 0;
                        }
                        headerParsed = true;
                        console.log(`⚡ [TailSend Web] Incoming file: ${filename} (${totalBytes} bytes)`);

                        const totalMB = (totalBytes / 1048576).toFixed(1);
                        updateHUD(true, "Receiving...", filename, `0.0 MB / ${totalMB} MB`, 0.0, "Receiving...");
                        if (window.updateSlintTransferState) {
                            window.updateSlintTransferState(true, false, "Receiving...", filename, `0.0 MB / ${totalMB} MB`, 0.0, "Receiving...");
                        }

                        const headerByteLen = new TextEncoder().encode(headerBuffer.substring(0, newlineIdx + 1)).length;
                        const bodySlice = chunk.slice(headerByteLen);
                        if (bodySlice.length > 0) {
                            fileData.push(bodySlice);
                            receivedBytes += bodySlice.length;
                        }
                    }
                } else {
                    fileData.push(chunk);
                    receivedBytes += chunk.length;

                    const progress = totalBytes > 0 ? Math.min(1.0, receivedBytes / totalBytes) : 0.5;
                    const elapsedSec = (performance.now() - startTime) / 1000;
                    const speed = elapsedSec > 0 ? ((receivedBytes / 1048576) / elapsedSec).toFixed(1) + " MB/s" : "Calculating...";
                    const totalMB = (totalBytes / 1048576).toFixed(1);
                    const bytesText = `${(receivedBytes / 1048576).toFixed(1)} MB / ${totalMB} MB`;

                    updateHUD(true, "Receiving...", filename, bytesText, progress, speed);
                    if (window.updateSlintTransferState) {
                        window.updateSlintTransferState(true, false, "Receiving...", filename, bytesText, progress, speed);
                    }
                }
            }
            conn.close();

            // Trigger browser file download
            const blob = new Blob(fileData, { type: "application/octet-stream" });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            }, 1000);

            const finalMB = (receivedBytes / 1048576).toFixed(1);
            updateHUD(false, "Download Complete!", filename, `${finalMB} MB`, 1.0, "Saved", true);
            if (window.updateSlintTransferState) {
                window.updateSlintTransferState(false, true, "[Completed] Download Complete!", filename, `${finalMB} MB`, 1.0, "Saved");
            }
            if (window.onFileReceivedCompleteSlint) {
                window.onFileReceivedCompleteSlint(filename, receivedBytes);
            }
            console.log(`✅ [TailSend Web] File saved to downloads: ${filename} (${receivedBytes} bytes)`);
        }

        // Manual connect to peer from join code input
        window.connectToPeerFromInput = async function(targetAddr) {
            targetHostAddr = targetAddr;
            window.hostTailcatAddress = targetAddr;
            console.log("[TailSend Web] Manual connect requested to peer:", targetAddr);
            await sendInitialP2PHandshake();
        };

        // Send Text Message via Tailcat Port 101
        window.sendTailcatTextMessage = async function(text) {
            const addr = getHostAddress();
            if (!text || !addr) {
                console.error("[TailSend Web] Missing text or host address. Text:", text, "Addr:", addr);
                alert("Error: Target host address not found (" + (addr || "empty") + "). Please scan QR again.");
                return;
            }
            console.log("[TailSend Web] Sending text via Tailcat P2P (Port 101) to " + addr + ":", text);
            updateHUD(true, "Sending via Tailcat P2P...", "memo.txt", "", 0.5, "Direct P2P");
            if (window.updateSlintTransferState) {
                window.updateSlintTransferState(true, false, "Sending via Tailcat P2P...", "memo.txt", "", 0.5, "WireGuard P2P");
            }
            if (window.updateSlintStatusText) {
                window.updateSlintStatusText("Sending message to macOS...");
            }

            try {
                const conn = await window.tailcatDial({
                    addr: addr,
                    port: 101,
                    derpMapURL: "https://tailcat.dev/derpmap.json"
                });
                const encoder = new TextEncoder();
                await conn.write(encoder.encode(text));
                await conn.closeWrite();
                conn.close();
                console.log("✅ [TailSend Web] Text delivered directly to Mac via Tailcat P2P!");
                updateHUD(false, "Delivered!", "memo.txt", "", 1.0, "Saved", true);
                if (window.updateSlintTransferState) {
                    window.updateSlintTransferState(false, true, "[Completed] Delivered to macOS!", "memo.txt", "", 1.0, "Saved");
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("Message delivered to macOS via Tailcat P2P!");
                }
            } catch (err) {
                console.error("[TailSend Web] Failed to dial host:", err);
                alert("Tailcat P2P Dial Error: " + (err.message || err));
                updateHUD(false, "Failed", "memo.txt", "", 0, "Error");
                if (window.updateSlintTransferState) {
                    window.updateSlintTransferState(false, false, "Failed to deliver message", "memo.txt", "", 0, "Error");
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("Dial Error: " + (err.message || err));
                }
            }
        };

        // Paste & Send from Clipboard
        window.triggerPasteAndSend = async function() {
            try {
                let text = "";
                if (navigator.clipboard && navigator.clipboard.readText) {
                    text = await navigator.clipboard.readText();
                }
                if (!text) {
                    text = prompt("Paste text to send to PC:") || "";
                }
                if (text) {
                    window.sendTailcatTextMessage(text);
                    if (window.onTextSentSlint) {
                        window.onTextSentSlint(text);
                    }
                }
            } catch (err) {
                console.warn("[TailSend Clipboard] Could not read directly, using prompt:", err);
                const text = prompt("Paste text to send to PC:");
                if (text) {
                    window.sendTailcatTextMessage(text);
                    if (window.onTextSentSlint) {
                        window.onTextSentSlint(text);
                    }
                }
            }
        };

        // OS Share Sheet (Web Share API)
        window.triggerShareText = async function(text) {
            const shareContent = text || window.lastReceivedMessage || "TailSend Content";
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: "TailSend Received Text",
                        text: shareContent
                    });
                    console.log("[TailSend Share] Successfully shared via OS Share Sheet");
                    return;
                } catch (err) {
                    if (err.name !== "AbortError") {
                        console.error("[TailSend Share Error]", err);
                    }
                }
            }
            // Fallback: Copy to clipboard and alert
            window.triggerCopyText(shareContent);
        };

        // Save Text as File (.txt)
        window.triggerSaveText = function(text) {
            const content = text || window.lastReceivedMessage || "TailSend Content";
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const now = new Date();
            const dateStr = now.toISOString().replace(/[-:T]/g, "").slice(0, 14);
            a.href = url;
            a.download = `tailsend_text_${dateStr}.txt`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 1000);
        };

        // Copy Text to Clipboard
        window.triggerCopyText = async function(text) {
            const content = text || window.lastReceivedMessage || "";
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(content);
                    alert("Text copied to clipboard!");
                } else {
                    const ta = document.createElement("textarea");
                    ta.value = content;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                    alert("Text copied to clipboard!");
                }
            } catch (e) {
                alert("Failed to copy text: " + e);
            }
        };

        // Send File directly via Tailcat WireGuard P2P (Port 102)
        window.sendTailcatFileChunked = async function(file) {
            const addr = getHostAddress();
            if (!file || !addr) {
                alert("Error: Target host address not found. Please scan QR again.");
                return;
            }
            console.log("[TailSend Web] Streaming file via Tailcat P2P (Port 102) to " + addr + ":", file.name, file.size, "bytes");
            const totalMB = (file.size / 1048576).toFixed(1);

            updateHUD(true, "Connecting P2P...", file.name, `0.0 MB / ${totalMB} MB`, 0.0, "Connecting...");
            if (window.updateSlintTransferState) {
                window.updateSlintTransferState(true, false, "Connecting P2P...", file.name, `0.0 MB / ${totalMB} MB`, 0.0, "Connecting...");
            }
            if (window.updateSlintStatusText) {
                window.updateSlintStatusText(`Connecting file transfer: ${file.name}`);
            }

            try {
                const conn = await window.tailcatDial({
                    addr: addr,
                    port: 102,
                    derpMapURL: "https://tailcat.dev/derpmap.json"
                });

                updateHUD(true, "Sending to macOS...", file.name, `0.0 MB / ${totalMB} MB`, 0.1, "Transferring...");
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText(`Transferring ${file.name}...`);
                }
                
                // 1. Send filename and size header
                const header = new TextEncoder().encode(`NAME:${file.name}:${file.size}\n`);
                await conn.write(header);

                // 2. Stream file content in chunks
                const startTime = performance.now();
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                let transferredBytes = 0;

                for (let chunkIdx = 0; chunkIdx < totalChunks; chunkIdx++) {
                    if (window.isTransferCancelled) {
                        break;
                    }

                    const start = chunkIdx * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, file.size);
                    const blobSlice = file.slice(start, end);
                    const arrayBuffer = await blobSlice.arrayBuffer();
                    const bytes = new Uint8Array(arrayBuffer);

                    await conn.write(bytes);

                    transferredBytes = end;
                    const progress = transferredBytes / file.size;
                    const elapsedSec = (performance.now() - startTime) / 1000;
                    const speedMBs = elapsedSec > 0 ? ((transferredBytes / 1048576) / elapsedSec).toFixed(1) + " MB/s" : "Calculating...";
                    const bytesText = `${(transferredBytes / 1048576).toFixed(1)} MB / ${totalMB} MB`;

                    updateHUD(true, "Sending to macOS...", file.name, bytesText, progress, speedMBs);
                    if (window.updateSlintTransferState) {
                        window.updateSlintTransferState(true, false, "Sending...", file.name, bytesText, progress, speedMBs);
                    }

                    if (chunkIdx % 4 === 0) {
                        await new Promise(r => requestAnimationFrame(r));
                    }
                }

                try {
                    await conn.closeWrite();
                } catch (e) {
                    console.warn("closeWrite warning:", e);
                }
                conn.close();

                updateHUD(false, "Transfer Complete!", file.name, `${totalMB} MB`, 1.0, "", true);
                if (window.updateSlintTransferState) {
                    window.updateSlintTransferState(false, true, "[Completed] Transfer Successful!", file.name, `${totalMB} MB`, 1.0, "Saved");
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText(`Delivered ${file.name} (${totalMB} MB) to macOS!`);
                }
                console.log("✅ [TailSend Web] File successfully delivered to Mac via Tailcat P2P!");
            } catch (err) {
                console.error("[TailSend Web] Failed to send file via Tailcat P2P:", err);
                alert("File transfer error: " + (err.message || err));
                updateHUD(false, "Transfer Failed", file.name, "0.0 MB", 0.0, "Error");
                if (window.updateSlintTransferState) {
                    window.updateSlintTransferState(false, false, "Transfer Failed", file.name, "0.0 MB", 0.0, "Error");
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("Transfer Error: " + (err.message || err));
                }
            }
        };

        const fileInputEl = document.getElementById("global-file-picker");
        if (fileInputEl) {
            fileInputEl.onchange = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (file) {
                    console.log("[TailSend Web] File chosen:", file.name, file.size);
                    await window.sendTailcatFileChunked(file);
                    fileInputEl.value = "";
                }
            };
        }

        window.triggerFilePicker = function() {
            console.log("[TailSend Web] triggerFilePicker called");
            const input = document.getElementById("global-file-picker");
            if (input) {
                input.click();
            }
        };

        async function initTailcatEngine() {
            try {
                console.log("[TailSend WASM] Starting async Tailcat WireGuard P2P engine load...");
                if (typeof Go !== "undefined") {
                    const go = new Go();
                    const tailcatBytes = await fetchAndDecompressWasmBytes("./assets/tailcat.wasm.gz");
                    const result = await WebAssembly.instantiate(tailcatBytes, go.importObject);
                    const instance = result.instance || result;
                    go.run(instance);
                    console.log("✅ [TailSend WASM] Tailcat WireGuard engine ready!");
                    const hostAddr = getHostAddress();
                    if (hostAddr) {
                        await sendInitialP2PHandshake();
                    } else {
                        await startHostListenerAndGenerateQR();
                    }
                }
            } catch (err) {
                console.error("[TailSend WASM Error]", err);
                showDebugError(err);
            }
        }

        async function init() {
            try {
                updateStatus("Launching TailSend UI interface...");
                const moduleUrl = `./pkg/tailsend_web.js?_cb=${BUILD_TIMESTAMP}`;
                const { default: initWasm, run_app } = await import(moduleUrl);
                const slintBytes = await fetchAndDecompressWasmBytes("./pkg/tailsend_web_bg.wasm.gz");
                await initWasm({ module_or_path: slintBytes });

                try {
                    if (typeof run_app === "function") {
                        run_app();
                    }
                } catch (e) {
                    if (e && (e.message?.includes("Using exceptions for control flow") || String(e).includes("Using exceptions for control flow"))) {
                        console.log("[TailSend Loader] Expected winit control flow yield, proceeding.");
                    } else {
                        throw e;
                    }
                }

                hideLoader();

                // Initialize Tailcat WASM P2P Engine in background
                initTailcatEngine();
            } catch (err) {
                console.error("[TailSend Bootstrap Error]", err);
                updateStatus(`Bootstrap Error: ${err.message || err}`);
                showDebugError(err);
                const spinner = document.querySelector(".spinner");
                if (spinner) spinner.style.borderTopColor = "#ef4444";
            }
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
