<body>
    <div id="loader">
        <img src="assets/icon.png" width="72" height="72" alt="Ponlet" style="border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-bottom: 16px;">

        <div class="title">Ponlet</div>
        <div class="status" id="status">Loading Ponlet...</div>
        <div id="debug-log"></div>
    </div>

    <!-- Native HTML UTF-8 / Japanese Text Composer Modal -->
    <div id="composer-modal">
        <div class="composer-backdrop" id="composer-backdrop"></div>
        <div class="composer-card">
            <div class="composer-header">
                <span class="composer-title">💬 メッセージ入力 (日本語 / UTF-8)</span>

                <span class="composer-hint">Shift+Enterで改行 / Enterで即時送信</span>

    <canvas id="canvas"></canvas>
    <input type="file" id="global-file-picker" style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:auto;clip:rect(0,0,0,0);" />

    <script type="module">
        const statusEl = document.getElementById("status");
        const loaderEl = document.getElementById("loader");
        const debugEl = document.getElementById("debug-log");

        window.lastReceivedMessage = "";

        function updateStatus(msg) {
            if (statusEl) statusEl.textContent = msg;
            console.log("[Ponlet Loader]", msg);
        }

        function showDebugError(err) {
            console.error("[Ponlet Debug]", err);
            if (debugEl) {
                debugEl.textContent = "Error: " + (err.message || String(err));
            }
        }

        window.addEventListener("error", (e) => showDebugError(e.error || e.message));
        window.addEventListener("unhandledrejection", (e) => showDebugError(e.reason));

        function hideLoader() {
            if (loaderEl) {
                loaderEl.style.pointerEvents = "none";
                loaderEl.style.opacity = "0";
                setTimeout(() => {
                    if (loaderEl && loaderEl.parentNode) {
                        loaderEl.parentNode.removeChild(loaderEl);
                    }
                }, 300);
            }
        }

        // Dedicated Slint TransferProgressCard handles all progress UI
        function updateHUD() {}

        // Wrap window.updateSlintTransferState to seamlessly support both 7-arg and 8-arg calls
        let _rawUpdateSlintTransferState = null;
        Object.defineProperty(window, "updateSlintTransferState", {
            get() {
                return function(is_transferring, completed, is_sender_or_status, status_or_filename, filename_or_bytes, bytes_or_prog, prog_or_speed, speed_opt) {
                    if (!_rawUpdateSlintTransferState) return;
                    if (typeof is_sender_or_status === "boolean") {
                        // 8 arguments: (is_transferring, completed, is_sender, status, filename, bytes_text, progress, speed)
                        _rawUpdateSlintTransferState(is_transferring, completed, is_sender_or_status, status_or_filename, filename_or_bytes, bytes_or_prog, prog_or_speed, speed_opt);
                    } else {
                        // 7 arguments: (is_transferring, completed, status, filename, bytes_text, progress, speed)
                        _rawUpdateSlintTransferState(is_transferring, completed, false, is_sender_or_status, status_or_filename, filename_or_bytes, bytes_or_prog, prog_or_speed);
                    }
                };
            },
            set(fn) {
                _rawUpdateSlintTransferState = fn;
            },
            configurable: true
        });

        // IndexedDB Cache for Decompressed WASM Binaries
        const WASM_DB_NAME = "ponlet_wasm_cache";
        const WASM_DB_VERSION = 1;
        const WASM_STORE_NAME = "wasm_files";

        function openWasmCacheDB() {
            return new Promise((resolve, reject) => {
                if (typeof indexedDB === "undefined") {
                    return reject(new Error("IndexedDB is not supported in this environment"));
                }
                try {
                    const request = indexedDB.open(WASM_DB_NAME, WASM_DB_VERSION);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(WASM_STORE_NAME)) {
                            db.createObjectStore(WASM_STORE_NAME, { keyPath: "url" });
                        }
                    };
                    request.onsuccess = (event) => resolve(event.target.result);
                    request.onerror = (event) => reject(event.target.error || new Error("Failed to open IndexedDB"));
                    request.onblocked = () => reject(new Error("IndexedDB opening blocked"));
                } catch (err) {
                    reject(err);
                }
            });
        }

        async function getCachedWasm(urlKey) {
            try {
                const db = await openWasmCacheDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(WASM_STORE_NAME, "readonly");
                    tx.onerror = () => reject(tx.error);
                    const store = tx.objectStore(WASM_STORE_NAME);
                    const req = store.get(urlKey);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            } catch (err) {
                console.warn("[WASM Cache] Error reading from cache:", err);
                return null;
            }
        }

        async function putCachedWasm(entry) {
            try {
                const db = await openWasmCacheDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(WASM_STORE_NAME, "readwrite");
                    tx.onerror = () => reject(tx.error);
                    const store = tx.objectStore(WASM_STORE_NAME);
                    const req = store.put(entry);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            } catch (err) {
                console.warn("[WASM Cache] Error saving to cache:", err);
            }
        }

        async function fetchAndDecompressWasmBytes(url) {
            const cacheKey = url.split("?")[0];
            let cached = null;
            try {
                cached = await getCachedWasm(cacheKey);
            } catch (e) {
                console.warn("[WASM Cache] Failed to lookup cache for", url, e);
            }

            const headers = {};
            if (cached && cached.data) {
                if (cached.etag) {
                    headers["If-None-Match"] = cached.etag;
                }
                if (cached.lastModified) {
                    headers["If-Modified-Since"] = cached.lastModified;
                }
            }

            let response;
            try {
                response = await fetch(url, {
                    headers,
                    cache: "no-cache"
                });
            } catch (networkErr) {
                if (cached && cached.data) {
                    console.warn(`[WASM Cache] Network fetch error for ${url}. Falling back to cached binary:`, networkErr);
                    return cached.data;
                }
                throw networkErr;
            }

            // 304 Not Modified: Server binary unchanged, reuse decompressed cache
            if (response.status === 304 && cached && cached.data) {
                console.log(`[WASM Cache] 304 Not Modified for ${url}. Reusing cached decompressed binary (${(cached.data.byteLength / 1024 / 1024).toFixed(2)} MB).`);
                return cached.data;
            }

            // HTTP error fallback if cached version is available
            if (!response.ok) {
                if (cached && cached.data) {
                    console.warn(`[WASM Cache] HTTP ${response.status} returned for ${url}. Falling back to cached binary.`);
                    return cached.data;
                }
                throw new Error(`HTTP ${response.status} while fetching ${url}`);
            }

            // 200 OK: Read and decompress body
            let arrayBuffer;
            if (url.endsWith(".gz") && typeof DecompressionStream !== "undefined") {
                const decompressedStream = response.body.pipeThrough(new DecompressionStream("gzip"));
                const blob = await new Response(decompressedStream).blob();
                arrayBuffer = await blob.arrayBuffer();
            } else {
                arrayBuffer = await response.arrayBuffer();
            }

            // Handle potential 304-as-200 with empty body
            if (arrayBuffer.byteLength === 0 && cached && cached.data) {
                console.log(`[WASM Cache] Empty body received for ${url}. Using cached binary.`);
                return cached.data;
            }

            const etag = response.headers.get("etag") || response.headers.get("ETag") || null;
            const lastModified = response.headers.get("last-modified") || response.headers.get("Last-Modified") || null;

            try {
                await putCachedWasm({
                    url: cacheKey,
                    etag,
                    lastModified,
                    data: arrayBuffer,
                    timestamp: Date.now()
                });
                console.log(`[WASM Cache] Cached decompressed WASM for ${url} (ETag: ${etag}, Size: ${(arrayBuffer.byteLength / 1024 / 1024).toFixed(2)} MB)`);
            } catch (saveErr) {
                console.warn("[WASM Cache] Failed to save WASM to IndexedDB:", saveErr);
            }

            return arrayBuffer;
        }

        const CHUNK_SIZE = 64 * 1024; // 64 KiB
        let targetHostAddr = "";

        function getTargetAddress() {
            if (window.targetPeerAddress && window.targetPeerAddress.length > 5) {
                return window.targetPeerAddress;
            }
            if (targetHostAddr && targetHostAddr.length > 5 && !targetHostAddr.startsWith("p2Ex")) {
                return targetHostAddr;
            }
            if (window.hostTailcatAddress && window.hostTailcatAddress.length > 5) {
                return window.hostTailcatAddress;
            }

            // Fallback: Extract from URL
            const hash = window.location.hash || "";
            const match = hash.match(/i=([^&]+)/);
            if (match) {
                const token = match[1];
                try {
                    let base64 = token.replace(/-/g, '+').replace(/_/g, '/');
                    while (base64.length % 4) base64 += '=';
                    const binary = atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

                    // Scan for UTF-8 string following CBOR key 3 ('\x03')
                    for (let i = 0; i < bytes.length - 8; i++) {
                        if (bytes[i] === 3 && (bytes[i + 1] >= 0x60 && bytes[i + 1] <= 0x7b)) {
                            let len = 0;
                            let start = 0;
                            if (bytes[i + 1] <= 0x77) {
                                len = bytes[i + 1] - 0x60;
                                start = i + 2;
                            } else if (bytes[i + 1] === 0x78) {
                                len = bytes[i + 2];
                                start = i + 3;
                            } else if (bytes[i + 1] === 0x79) {
                                len = (bytes[i + 2] << 8) | bytes[i + 3];
                                start = i + 4;
                            }
                            if (len > 0 && start + len <= bytes.length) {
                                const decoder = new TextDecoder('utf-8');
                                const addr = decoder.decode(bytes.slice(start, start + len));
                                if (addr.length > 5) {
                                    targetHostAddr = addr;
                                    window.targetPeerAddress = addr;
                                    return addr;
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn("[Ponlet Web] CBOR scan failed:", e);
                }
            }
            return targetHostAddr || "";
        }

        // Backward compatibility
        function getHostAddress() {
            return getTargetAddress();
        }

        // Transport Type Poller (0: Direct WireGuard, 1: WebRTC DataChannel, 2: DERP Relay)
        let transportPoller = null;
        function startTransportPoller(targetAddr) {
            if (transportPoller) clearInterval(transportPoller);
            const checkTransport = async () => {
                if (!window.tailcatGetTransport) return;
                try {
                    const addr = targetAddr || getTargetAddress();
                    if (!addr) return;
                    const tType = await window.tailcatGetTransport(addr);
                    if (window.setSlintTransportType) {
                        window.setSlintTransportType(tType);
                    }
                } catch (_) {}
            };
            transportPoller = setInterval(checkTransport, 2000);
            setTimeout(checkTransport, 300);
        }

        // Send Initial Direct P2P Handshake to Host (including own address for two-way communication)
        async function sendInitialP2PHandshake(hostAddrOverride, ownAddrOverride) {
            const addr = hostAddrOverride || getTargetAddress();
            if (!addr || !window.tailcatDial) {
                console.warn("[Ponlet Web] Host address or tailcatDial not yet available for handshake:", addr);
                return;
            }
            let conn = null;
            try {
                console.log("[Ponlet Web] Connecting initial P2P handshake to Host:", addr);
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("相手端末に接続中…");
                }
                conn = await window.tailcatDial({
                    addr: addr,
                    port: 101,
                    derpMapURL: "https://tailcat.dev/derpmap.json"
                });
                const encoder = new TextEncoder();
                const myAddr = ownAddrOverride || window.ownTailcatAddress || "";
                const handshakeMsg = myAddr.length > 5
                    ? `🤝 [Connected] JOIN:${myAddr}\n`
                    : "🤝 [Connected] Peer connected via Tailcat WireGuard P2P!\n";
                await conn.write(encoder.encode(handshakeMsg));
                try {
                    await conn.closeWrite();
                } catch (_) {}
                console.log("✅ [Ponlet Web] Direct P2P Handshake successfully delivered to Host! (My addr:", myAddr, ")");
                if (window.onPeerConnectedSlint) {
                    window.onPeerConnectedSlint("接続された相手端末");
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("直接暗号化P2Pで接続しました！");
                }
                startTransportPoller(addr);
            } catch (err) {
                console.warn("[Ponlet Web] Handshake notice:", err);
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("接続準備完了 (WireGuard P2P)");
                }
            } finally {
                if (conn) {
                    try { conn.close(); } catch (_) {}
                }
            }
        }

        // Joiner Mode: Start Tailcat WireGuard Listener so Joiner can receive text & files from Host
        async function startJoinerListenerAndConnect(hostAddr) {
            try {
                console.log("[Ponlet Web] Joiner Mode: Starting local Tailcat WireGuard listener...");
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("P2P通信環境を初期化中…");
                }
                const listener = await window.tailcatListen({
                    derpMapURL: "https://tailcat.dev/derpmap.json",
                    onConnection: (conn) => {
                        console.log("⚡ [Ponlet Web] Incoming WireGuard P2P connection on Joiner!", conn);
                        handleIncomingP2PConnection(conn);
                    }
                });

                console.log("⚡ [Ponlet Web] Joiner local Tailcat address acquired:", listener.address);
                window.ownTailcatAddress = listener.address;
                window.targetPeerAddress = hostAddr;

                // Deliver handshake to Host with our address so Host can pair with us
                await sendInitialP2PHandshake(hostAddr, listener.address);
            } catch (err) {
                console.error("[Ponlet Web] Failed to start Joiner listener:", err);
                // Fallback: Still attempt handshake even if local listener failed
                await sendInitialP2PHandshake(hostAddr, "");
            }
        }

        // Host Mode: Start Tailcat WireGuard Listener and notify Slint to render QR Code
        async function startHostListenerAndGenerateQR() {
            try {
                console.log("[Ponlet Web] Host Mode: Starting Tailcat WireGuard listener...");
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("安全なP2P通信を準備しています…");
                }
                const listener = await window.tailcatListen({
                    derpMapURL: "https://tailcat.dev/derpmap.json",
                    onConnection: (conn) => {
                        console.log("⚡ [Ponlet Web] Incoming WireGuard P2P connection from peer!", conn);
                        handleIncomingP2PConnection(conn);
                    }
                });

                console.log("⚡ [Ponlet Web] Tailcat host address acquired:", listener.address);
                window.ownTailcatAddress = listener.address;

                if (window.onTailcatHostAddressReady) {
                    window.onTailcatHostAddressReady(listener.address);
                }
            } catch (err) {
                console.error("[Ponlet Web] Failed to start Tailcat listener:", err);
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("Listener Error: " + (err.message || err));
                }
            }
        }

        // Handle incoming connection (both Host and Joiner)
        async function handleIncomingP2PConnection(conn) {
            try {
                if (conn.port === 101) {
                    let buffer = "";
                    const decoder = new TextDecoder();
                    try {
                        while (true) {
                            const chunk = await conn.read();
                            if (!chunk || chunk.length === 0) break;
                            buffer += decoder.decode(chunk, { stream: true });
                            let newlineIdx;
                            while ((newlineIdx = buffer.indexOf("\n")) !== -1) {
                                const line = buffer.slice(0, newlineIdx);
                                buffer = buffer.slice(newlineIdx + 1);
                                if (line.trim().length > 0) {
                                    dispatchIncomingTextMessage(line.trim());
                                }
                            }
                        }
                        buffer += decoder.decode();
                        if (buffer.trim().length > 0) {
                            dispatchIncomingTextMessage(buffer.trim());
                        }
                    } finally {
                        try { conn.close(); } catch (_) {}
                    }
                } else if (conn.port === 102) {
                    await handleIncomingFileStream(conn);
                }
            } catch (err) {
                console.error("[Ponlet Web] Incoming connection error:", err);
            }
        }

        function dispatchIncomingTextMessage(text) {
            console.log("⚡ [Ponlet Web] Received text on Port 101:", text);

            let isHandshake = false;
            // Check for JOIN:<address> handshake
            if (text.includes("JOIN:")) {
                isHandshake = true;
                const parts = text.split("JOIN:");
                if (parts.length > 1) {
                    const peerAddr = parts[1].trim().split(/\s+/)[0];
                    if (peerAddr && peerAddr.length > 5) {
                        window.targetPeerAddress = peerAddr;
                        console.log("🔗 [Ponlet Web] Automatically paired with remote peer:", peerAddr);
                    }
                }
            }
            if (text.startsWith("🤝")) {
                isHandshake = true;
            }

            if (isHandshake) {
                if (window.onPeerConnectedSlint) {
                    window.onPeerConnectedSlint("接続された相手端末");
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("直接暗号化P2Pで接続しました！");
                }
                startTransportPoller(window.targetPeerAddress);
            } else if (text.trim().length > 0) {
                if (window.onPeerConnectedSlint) {
                    window.onPeerConnectedSlint("接続された相手端末");
                }
                window.lastReceivedMessage = text;
                if (window.onIncomingTextMessageSlint) {
                    window.onIncomingTextMessageSlint(text);
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("メッセージを受信しました！");
                }
            }
        }

        // Receive File Stream on Port 102
        async function handleIncomingFileStream(conn) {
            let filename = "received_file.bin";
            let totalBytes = 0;
            let receivedBytes = 0;
            let fileData = [];

            let headerBuffer = "";
            const decoder = new TextDecoder();
            let headerParsed = false;
            let startTime = performance.now();

            if (window.onPeerConnectedSlint) {
                window.onPeerConnectedSlint("Remote Peer (P2P)");
            }

            try {
                while (true) {
                    if (totalBytes > 0 && receivedBytes >= totalBytes) {
                        console.log(`⚡ [Ponlet Web] Reached totalBytes (${receivedBytes}/${totalBytes}), completing read loop.`);
                        break;
                    }

                    const chunk = await conn.read();
                    if (!chunk || chunk.length === 0) {
                        console.log("⚡ [Ponlet Web] Received EOF on Port 102");
                        break;
                    }

                    if (!headerParsed) {
                        headerBuffer += decoder.decode(chunk, { stream: true });
                        const newlineIdx = headerBuffer.indexOf("\n");
                        if (newlineIdx !== -1) {
                            const headerLine = headerBuffer.substring(0, newlineIdx).trim();
                            const parts = headerLine.split(":");
                            if (parts.length >= 3 && parts[0] === "NAME") {
                                filename = parts[1];
                                totalBytes = parseInt(parts[2], 10) || 0;
                            }
                            headerParsed = true;
                            console.log(`⚡ [Ponlet Web] Incoming file: ${filename} (${totalBytes} bytes)`);

                            const totalMB = (totalBytes / 1048576).toFixed(1);
                            if (window.updateSlintTransferState) {
                                window.updateSlintTransferState(true, false, false, "ファイル受信中…", filename, `0.0 MB / ${totalMB} MB`, 0.0, "受信中…");
                            }

                            const headerByteLen = new TextEncoder().encode(headerBuffer.substring(0, newlineIdx + 1)).length;
                            const bodySlice = chunk.slice(headerByteLen);
                            if (bodySlice.length > 0) {
                                fileData.push(bodySlice);
                                receivedBytes += bodySlice.length;
                            }

                            if (totalBytes > 0 && receivedBytes >= totalBytes) {
                                console.log(`⚡ [Ponlet Web] Entire file received in header chunk (${receivedBytes}/${totalBytes})`);
                                break;
                            }
                        }
                    } else {
                        fileData.push(chunk);
                        receivedBytes += chunk.length;

                        const progress = totalBytes > 0 ? Math.min(1.0, receivedBytes / totalBytes) : 0.5;
                        const elapsedSec = (performance.now() - startTime) / 1000;
                        const speed = elapsedSec > 0 ? ((receivedBytes / 1048576) / elapsedSec).toFixed(1) + " MB/s" : "計算中…";
                        const totalMB = (totalBytes / 1048576).toFixed(1);
                        const bytesText = `${(receivedBytes / 1048576).toFixed(1)} MB / ${totalMB} MB`;

                        if (window.updateSlintTransferState) {
                            window.updateSlintTransferState(true, false, false, "ファイル受信中…", filename, bytesText, progress, speed);
                        }

                        if (totalBytes > 0 && receivedBytes >= totalBytes) {
                            console.log(`⚡ [Ponlet Web] All bytes received (${receivedBytes}/${totalBytes}), breaking loop.`);
                            break;
                        }
                    }
                }
            } catch (err) {
                console.warn("[Ponlet Web] Stream read interrupted:", err);
                if (totalBytes > 0 && receivedBytes < totalBytes) {
                    console.error(`[Ponlet Web] Incomplete file transfer: ${receivedBytes}/${totalBytes} bytes`);
                    if (window.updateSlintTransferState) {
                        window.updateSlintTransferState(false, false, false, "受信エラー: 転送が中断されました", filename, `${(receivedBytes / 1048576).toFixed(1)} MB / ${(totalBytes / 1048576).toFixed(1)} MB`, receivedBytes / totalBytes, "エラー");
                    }
                    if (window.updateSlintStatusText) {
                        window.updateSlintStatusText(`受信エラー: 転送が中断されました (${filename})`);
                    }
                    try { conn.close(); } catch (_) {}
                    return;
                }
            }

            try { await conn.closeWrite(); } catch (_) {}
            try { conn.close(); } catch (_) {}

            // Trigger browser file download
            if (fileData.length > 0 && receivedBytes > 0) {
                const blob = new Blob(fileData, { type: "application/octet-stream" });
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(downloadUrl);
                }, 1500);

                const finalMB = (receivedBytes / 1048576).toFixed(1);
                if (window.updateSlintTransferState) {
                    window.updateSlintTransferState(false, true, false, "ファイル受信完了", filename, `${finalMB} MB`, 1.0, "保存完了");
                }
                if (window.onFileReceivedCompleteSlint) {
                    window.onFileReceivedCompleteSlint(filename, receivedBytes);
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText(`${filename} (${finalMB} MB) の受信が完了しました！`);
                }
                console.log(`✅ [Ponlet Web] File saved to downloads: ${filename} (${receivedBytes} bytes)`);
            }
        }
        window.handleIncomingFileStream = handleIncomingFileStream;

        // Manual connect to peer from join code input
        window.connectToPeerFromInput = async function(targetAddr) {
            targetHostAddr = targetAddr;
            window.targetPeerAddress = targetAddr;
            console.log("[Ponlet Web] Manual connect requested to peer:", targetAddr);
            if (!window.ownTailcatAddress && window.tailcatListen) {
                try {
                    const listener = await window.tailcatListen({
                        derpMapURL: "https://tailcat.dev/derpmap.json",
                        onConnection: (conn) => {
                            console.log("⚡ [Ponlet Web] Incoming WireGuard P2P connection!", conn);
                            handleIncomingP2PConnection(conn);
                        }
                    });
                    window.ownTailcatAddress = listener.address;
                } catch (e) {
                    console.warn("[Ponlet Web] Could not start listener on manual join:", e);
                }
            }
            await sendInitialP2PHandshake(targetAddr, window.ownTailcatAddress || "");
        };

        // Send Text Message via Tailcat Port 101
        window.sendTailcatTextMessage = async function(text, fromSlint = false) {
            const addr = getTargetAddress();
            if (!text || !addr) {
                console.error("[Ponlet Web] Missing text or target peer address. Text:", text, "Addr:", addr);
                alert("エラー: 接続先の相手端末アドレスが見つかりません。QRコードを再スキャンしてください。");
                return;
            }
            console.log("[Ponlet Web] Sending text via Tailcat P2P (Port 101) to " + addr + ":", text);
            if (window.updateSlintStatusText) {
                window.updateSlintStatusText("テキストメッセージを送信中…");
            }

            try {
                const conn = await window.tailcatDial({
                    addr: addr,
                    port: 101,
                    derpMapURL: "https://tailcat.dev/derpmap.json"
                });
                const encoder = new TextEncoder();
                const outText = text.endsWith("\n") ? text : (text + "\n");
                await conn.write(encoder.encode(outText));
                await conn.closeWrite();
                conn.close();
                console.log("✅ [Ponlet Web] Text delivered directly to peer via Tailcat P2P!");
                if (!fromSlint && window.onTextSentSlint) {
                    window.onTextSentSlint(text);
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("テキストメッセージを送信しました");
                }
            } catch (err) {
                console.error("[Ponlet Web] Failed to dial peer:", err);
                alert("Tailcat P2P 送信エラー: " + (err.message || err));
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("送信エラー: " + (err.message || err));
                }
            }
        };

        // --- Native UTF-8 / Japanese Text Composer Logic ---
        const composerModalEl = document.getElementById("composer-modal");
        const composerTextareaEl = document.getElementById("composer-text");
        const composerBackdropEl = document.getElementById("composer-backdrop");
        const composerCloseBtnEl = document.getElementById("composer-close-btn");
        const composerCancelBtnEl = document.getElementById("composer-cancel-btn");
        const composerSubmitBtnEl = document.getElementById("composer-submit-btn");

        window.triggerOpenComposer = function(initialText = "") {
            if (composerModalEl && composerTextareaEl) {
                if (initialText && typeof initialText === "string") {
                    composerTextareaEl.value = initialText;
                }
                composerModalEl.style.display = "flex";
                setTimeout(() => {
                    composerTextareaEl.focus();
                }, 50);
            }
        };

        window.closeComposer = function() {
            if (composerModalEl) {
                composerModalEl.style.display = "none";
            }
        };

        window.submitComposerText = function() {
            if (!composerTextareaEl) return;
            const text = composerTextareaEl.value.trim();
            if (text) {
                window.sendTailcatTextMessage(text, false);
                composerTextareaEl.value = "";
                window.closeComposer();
            }
        };

        if (composerBackdropEl) composerBackdropEl.onclick = window.closeComposer;
        if (composerCloseBtnEl) composerCloseBtnEl.onclick = window.closeComposer;
        if (composerCancelBtnEl) composerCancelBtnEl.onclick = window.closeComposer;
        if (composerSubmitBtnEl) composerSubmitBtnEl.onclick = window.submitComposerText;

        if (composerTextareaEl) {
            composerTextareaEl.addEventListener("keydown", (e) => {
                // Enter sends unless Shift is held or Japanese/CJK IME composition is active
                if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    window.submitComposerText();
                }
            });
        }

        // Paste & Send from Clipboard (supports UTF-8 / Japanese)
        window.triggerPasteAndSend = async function() {
            try {
                let text = "";
                if (navigator.clipboard && navigator.clipboard.readText) {
                    text = await navigator.clipboard.readText();
                }
                if (text && text.trim().length > 0) {
                    window.sendTailcatTextMessage(text.trim(), false);
                } else {
                    window.triggerOpenComposer();
                }
            } catch (err) {
                console.warn("[Ponlet Clipboard] Could not read directly from clipboard, opening composer:", err);
                window.triggerOpenComposer();
            }
        };

        // OS Share Sheet (Web Share API)
        window.triggerShareText = async function(text) {
            const shareContent = text || window.lastReceivedMessage || "Ponlet Content";
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: "Ponlet Received Text",
                        text: shareContent
                    });
                    console.log("[Ponlet Share] Successfully shared via OS Share Sheet");
                    return;
                } catch (err) {
                    if (err.name !== "AbortError") {
                        console.error("[Ponlet Share Error]", err);
                    }
                }
            }
            // Fallback: Copy to clipboard and alert
            window.triggerCopyText(shareContent);
        };

        // Save Text as File (.txt)
        window.triggerSaveText = function(text) {
            const content = text || window.lastReceivedMessage || "Ponlet Content";
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const now = new Date();
            const dateStr = now.toISOString().replace(/[-:T]/g, "").slice(0, 14);
            a.href = url;
            a.download = `ponlet_text_${dateStr}.txt`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 1000);
        };

        // Copy Text to Clipboard
        window.triggerCopyText = async function(text) {
            const content = text || window.lastReceivedMessage || "";
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(content);
                    alert("Text copied to clipboard!");
                } else {
                    const ta = document.createElement("textarea");
                    ta.value = content;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                    alert("Text copied to clipboard!");
                }
            } catch (e) {
                alert("Failed to copy text: " + e);
            }
        };

        // Send File directly via Tailcat WireGuard P2P (Port 102)
        window.sendTailcatFileChunked = async function(file) {
            const addr = getTargetAddress();
            if (!file || !addr) {
                alert("エラー: 接続先の相手端末アドレスが見つかりません。QRコードを再スキャンしてください。");
                return;
            }
            console.log("[Ponlet Web] Streaming file via Tailcat P2P (Port 102) to " + addr + ":", file.name, file.size, "bytes");
            const totalMB = (file.size / 1048576).toFixed(1);

            if (window.updateSlintTransferState) {
                window.updateSlintTransferState(true, false, true, "接続中…", file.name, `0.0 MB / ${totalMB} MB`, 0.0, "接続中…");
            }
            if (window.updateSlintStatusText) {
                window.updateSlintStatusText(`ファイル送信の準備中: ${file.name}`);
            }

            let conn = null;
            try {
                conn = await window.tailcatDial({
                    addr: addr,
                    port: 102,
                    derpMapURL: "https://tailcat.dev/derpmap.json"
                });

                if (window.updateSlintTransferState) {
                    window.updateSlintTransferState(true, false, true, "ファイル送信中…", file.name, `0.0 MB / ${totalMB} MB`, 0.05, "送信中…");
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText(`ファイル送信中: ${file.name}…`);
                }
                
                // 1. Send filename and size header
                const header = new TextEncoder().encode(`NAME:${file.name}:${file.size}\n`);
                await conn.write(header);

                // 2. Stream file content in chunks
                const startTime = performance.now();
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                let transferredBytes = 0;

                for (let chunkIdx = 0; chunkIdx < totalChunks; chunkIdx++) {
                    if (window.isTransferCancelled) {
                        console.log("[Ponlet Web] File transfer cancelled by user");
                        break;
                    }

                    const start = chunkIdx * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, file.size);
                    const blobSlice = file.slice(start, end);
                    const arrayBuffer = await blobSlice.arrayBuffer();
                    const bytes = new Uint8Array(arrayBuffer);

                    await conn.write(bytes);

                    transferredBytes = end;
                    const progress = transferredBytes / file.size;
                    const elapsedSec = (performance.now() - startTime) / 1000;
                    const speedMBs = elapsedSec > 0 ? ((transferredBytes / 1048576) / elapsedSec).toFixed(1) + " MB/s" : "計算中…";
                    const bytesText = `${(transferredBytes / 1048576).toFixed(1)} MB / ${totalMB} MB`;

                    if (window.updateSlintTransferState) {
                        window.updateSlintTransferState(true, false, true, "ファイル送信中…", file.name, bytesText, progress, speedMBs);
                    }

                    // Yield event loop every chunk (critical on iOS Safari / mobile WebSockets)
                    if (totalChunks > 1) {
                        await new Promise(r => setTimeout(r, 4));
                    }
                }

                // Ensure the last chunk has cleared the browser network socket buffer
                await new Promise(r => setTimeout(r, 150));

                try {
                    await conn.closeWrite();
                } catch (e) {
                    console.warn("[Ponlet Web] closeWrite warning:", e);
                }

                // Wait for receiver to read remaining bytes and close its side (or 3-sec timeout)
                try {
                    const readEOF = conn.read();
                    const timeout = new Promise(r => setTimeout(r, 3000));
                    await Promise.race([readEOF, timeout]);
                } catch (_) {}

                // Small delay before tearing down client
                await new Promise(r => setTimeout(r, 200));
                try {
                    conn.close();
                } catch (_) {}

                if (window.updateSlintTransferState) {
                    window.updateSlintTransferState(false, true, true, "ファイル送信完了", file.name, `${totalMB} MB`, 1.0, "送信完了");
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText(`${file.name} (${totalMB} MB) の送信が完了しました！`);
                }
                console.log("✅ [Ponlet Web] File successfully delivered to peer via Tailcat P2P!");
            } catch (err) {
                console.error("[Ponlet Web] Failed to send file via Tailcat P2P:", err);
                alert("ファイル送信エラー: " + (err.message || err));
                if (window.updateSlintTransferState) {
                    window.updateSlintTransferState(false, false, true, "送信エラー", file.name, "0.0 MB", 0.0, "エラー");
                }
                if (window.updateSlintStatusText) {
                    window.updateSlintStatusText("送信エラー: " + (err.message || err));
                }
                if (conn) {
                    try { conn.close(); } catch (_) {}
                }
            }
        };

        const fileInputEl = document.getElementById("global-file-picker");
        if (fileInputEl) {
            fileInputEl.onchange = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (file) {
                    console.log("[Ponlet Web] File chosen:", file.name, file.size);
                    await window.sendTailcatFileChunked(file);
                    fileInputEl.value = "";
                }
            };
        }

        window.triggerFilePicker = function() {
            console.log("[Ponlet Web] triggerFilePicker called");
            const input = document.getElementById("global-file-picker");
            if (input) {
                input.click();
            }
        };

        async function initTailcatEngine() {
            try {
                console.log("[Ponlet WASM] Starting async Tailcat WireGuard P2P engine load...");
                if (typeof Go !== "undefined") {
                    const go = new Go();
                    const tailcatBytes = await fetchAndDecompressWasmBytes("./assets/tailcat.wasm.gz");
                    const result = await WebAssembly.instantiate(tailcatBytes, go.importObject);
                    const instance = result.instance || result;
                    go.run(instance);
                    console.log("✅ [Ponlet WASM] Tailcat WireGuard engine ready!");
                    const hostAddr = getTargetAddress();
                    if (hostAddr) {
                        // Joiner mode: Start local WireGuard listener so we can receive incoming streams,
                        // then dial Host with JOIN:<our_address>.
                        await startJoinerListenerAndConnect(hostAddr);
                    } else {
                        // Host mode: Start local WireGuard listener and generate QR code
                        await startHostListenerAndGenerateQR();
                    }
                }
            } catch (err) {
                console.error("[Ponlet WASM Error]", err);
                showDebugError(err);
            }
        }

        async function init() {
            try {
                updateStatus("Launching Ponlet UI interface...");
                const moduleUrl = "./pkg/tailsend_web.js";
                const { default: initWasm, run_app } = await import(moduleUrl);
                const slintBytes = await fetchAndDecompressWasmBytes("./pkg/tailsend_web_bg.wasm.gz");
                await initWasm({ module_or_path: slintBytes });

                try {
                    if (typeof run_app === "function") {
                        run_app();
                    }
                } catch (e) {
                    if (e && (e.message?.includes("Using exceptions for control flow") || String(e).includes("Using exceptions for control flow"))) {
                        console.log("[Ponlet Loader] Expected winit control flow yield, proceeding.");
                    } else {
                        throw e;
                    }
                }

                hideLoader();

                // Initialize Tailcat WASM P2P Engine in background
                initTailcatEngine();
            } catch (err) {
                console.error("[Ponlet Bootstrap Error]", err);
                updateStatus(`Bootstrap Error: ${err.message || err}`);
                showDebugError(err);
                const spinner = document.querySelector(".spinner");
                if (spinner) spinner.style.borderTopColor = "#ef4444";
            }
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>
</body>
