<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>プライバシーポリシー / Privacy Policy — Ponlet</title>
    <meta name="description" content="Ponlet Privacy Policy Dispatcher. Redirects automatically to Japanese or English privacy policy.">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <noscript>
        <meta http-equiv="refresh" content="0;url=privacy_en.html">
    </noscript>
    <script>
        (function() {
            var lang = (navigator.languages && navigator.languages[0] || navigator.language || '').toLowerCase();
            if (lang.startsWith('ja')) {
                location.replace('privacy_ja.html');
            } else {
                location.replace('privacy_en.html');
            }
        })();
    </script>
    <style>
        :root {
            --bg-color: #07151e;
            --bg-card: #0f2434;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(249, 115, 22, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --radius-md: 12px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .dispatcher-card {
            background: var(--bg-card);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-md);
            padding: 36px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lang-button {
            display: block;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .lang-button.primary {
            background-color: var(--accent);
            color: #ffffff;
        }

        .lang-button.primary:hover {
            background-color: var(--accent-hover);
        }

        .lang-button.secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .lang-button.secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="dispatcher-card">
        <noscript>
            <meta http-equiv="refresh" content="0;url=privacy_en.html">
        </noscript>
        <img src="favicon.png" alt="Ponlet Logo" class="logo" onerror="this.style.display='none'">
        <h1>Ponlet Privacy Policy</h1>
        <p>Please select your language / 言語を選択してください</p>
        <div class="button-group">
            <a href="privacy_en.html" class="lang-button primary">English</a>
            <a href="privacy_ja.html" class="lang-button secondary">日本語 (Japanese)</a>
        </div>
    </div>
</body>
</html>
