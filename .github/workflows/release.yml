name: Release Builds (Multi-Platform)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release draft
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Normalize source line endings
        shell: bash
        run: |
          # Git for Windows may check out LF sources as CRLF. Oxfmt reads the
          # bytes as-is, so restore the repository's LF form before checking.
          git config core.autocrlf false
          git checkout -- web-ui scripts
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Build Tauri desktop shell
        shell: bash
        run: ./scripts/build_tauri.sh
      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tailsend-windows-x86_64 | Out-Null
          Copy-Item target/release/tailsend.exe tailsend-windows-x86_64/ -ErrorAction Stop
          Copy-Item target/release/tailcat.dll tailsend-windows-x86_64/ -ErrorAction Stop
          Compress-Archive -Path tailsend-windows-x86_64/* -DestinationPath tailsend-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-windows-x86_64
          path: tailsend-windows-x86_64.zip

  build-macos:
    name: macOS desktop
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-darwin
            x86_64-apple-darwin
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Build Tauri desktop shell
        run: ./scripts/build_tauri.sh
      - name: Package macOS artifact
        run: |
          mkdir -p ponlet-macos
          cp target/release/tailsend ponlet-macos/
          tar -czf ponlet-macos.tar.gz -C ponlet-macos .
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-macos
          path: ponlet-macos.tar.gz

  build-linux:
    name: Linux desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - name: Test shared sessions and native event routing
        run: cargo test -p tailsend-core -p tailsend-transfer -p tailsend-native-transport --lib
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Build Tauri desktop shell
        run: ./scripts/build_tauri.sh
      - name: Package Linux artifact
        run: |
          mkdir -p ponlet-linux-x86_64
          cp target/release/tailsend ponlet-linux-x86_64/
          tar -czf ponlet-linux-x86_64.tar.gz -C ponlet-linux-x86_64 .
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-linux-x86_64
          path: ponlet-linux-x86_64.tar.gz

  build-android:
    name: Android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-java@v5
        with: { java-version: "17", distribution: temurin }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: android-actions/setup-android@v3
        with:
          # The runner image no longer provides the deprecated "tools" package
          # and sdkmanager exits with an error when it is requested.
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r28b }
      - name: Install Android signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/setup_android_signing.sh

      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Restore Firebase client configuration (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/tauri/gen/android/app/google-services.json
          else
            echo "::notice::Firebase client configuration is absent; telemetry will stay inactive."
          fi
      - name: Set date-based Android version code
        run: ./scripts/set_ci_build_number.sh PONLET_ANDROID_VERSION_CODE
      - run: ./scripts/build_tauri_mobile.sh android release
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
      - name: Collect APK
        run: |
          APK=$(find apps/tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" ponlet-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-android-arm64
          path: ponlet-android-arm64.apk

  build-ios:
    name: iOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - name: Select Xcode 26
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1 || true)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Set monotonic iOS build number
        run: ./scripts/set_ci_build_number.sh PONLET_IOS_BUILD_NUMBER
      - name: Install Apple signing material
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_SHARE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_SHARE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-keychain-pass' }}
        run: ./scripts/setup_ios_signing.sh

      - run: ./scripts/build_tauri_mobile.sh ios release
      - name: Collect IPA
        run: |
          IPA=$(find apps/tauri/gen/apple/build -type f -name '*.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" ponlet-ios-arm64.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-ios-arm64
          path: ponlet-ios-arm64.ipa

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.ipa' -o -name '*.aab' \) -exec cp {} release-assets/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
