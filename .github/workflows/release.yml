name: Release Builds (Multi-Platform)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release draft
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Normalize source line endings
        shell: bash
        run: |
          # Git for Windows may check out LF sources as CRLF. Oxfmt reads the
          # bytes as-is, so restore the repository's LF form before checking.
          git config core.autocrlf false
          git checkout -- web-ui scripts
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Build Tauri desktop shell
        shell: bash
        run: ./scripts/build_tauri.sh
      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tailsend-windows-x86_64 | Out-Null
          Copy-Item target/release/tailsend.exe tailsend-windows-x86_64/ -ErrorAction SilentlyContinue
          Compress-Archive -Path tailsend-windows-x86_64/* -DestinationPath tailsend-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-windows-x86_64
          path: tailsend-windows-x86_64.zip

  build-macos:
    name: macOS desktop
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-darwin
            x86_64-apple-darwin
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Build Tauri desktop shell
        run: ./scripts/build_tauri.sh
      - name: Package macOS artifact
        run: |
          mkdir -p ponlet-macos
          cp target/release/tailsend ponlet-macos/
          tar -czf ponlet-macos.tar.gz -C ponlet-macos .
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-macos
          path: ponlet-macos.tar.gz

  build-linux:
    name: Linux desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Build Tauri desktop shell
        run: ./scripts/build_tauri.sh
      - name: Package Linux artifact
        run: |
          mkdir -p ponlet-linux-x86_64
          cp target/release/tailsend ponlet-linux-x86_64/
          tar -czf ponlet-linux-x86_64.tar.gz -C ponlet-linux-x86_64 .
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-linux-x86_64
          path: ponlet-linux-x86_64.tar.gz

  build-android:
    name: Android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-java@v5
        with: { java-version: "17", distribution: temurin }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r28b }
      - name: Install Android signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/ponlet-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          STORE_PASSWORD=""
          for candidate in "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" android changeit; do
            if [ -n "$candidate" ] && keytool -list -keystore "$KEYSTORE_PATH" -storepass "$candidate" >/dev/null 2>&1; then
              STORE_PASSWORD="$candidate"
              break
            fi
          done
          test -n "$STORE_PASSWORD"
          KEY_ALIAS="$ANDROID_KEY_ALIAS"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            KEY_ALIAS=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')
          fi
          test -n "$KEY_ALIAS"
          KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          if ! keytool -exportcert -rfc -alias "$KEY_ALIAS" -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/ponlet-cert.pem" >/dev/null 2>&1; then
            KEY_PASSWORD="$STORE_PASSWORD"
          fi
          {
            echo "PONLET_ANDROID_KEYSTORE=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - run: ./scripts/build_tauri_mobile.sh android release
      - name: Collect APK
        run: |
          APK=$(find apps/tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" ponlet-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-android-arm64
          path: ponlet-android-arm64.apk

  build-ios:
    name: iOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache-dependency-path: tailcat/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web-ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - run: brew install xcodegen
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Install Apple signing material
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-keychain-pass' }}
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$BUILD_PROVISION_PROFILE_BASE64"
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          TEAM_ID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract TeamIdentifier.0 raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "APPLE_DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_CERTIFICATE_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
          echo "IOS_CERTIFICATE=$RUNNER_TEMP/certificate.p12" >> "$GITHUB_ENV"
          echo "IOS_MOBILE_PROVISION=$RUNNER_TEMP/profile.mobileprovision" >> "$GITHUB_ENV"
      - run: ./scripts/build_tauri_mobile.sh ios release
      - name: Collect IPA
        run: |
          IPA=$(find apps/tauri/gen/apple/build -type f -name '*.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" ponlet-ios-arm64.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ponlet-ios-arm64
          path: ponlet-ios-arm64.ipa

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.ipa' -o -name '*.aab' \) -exec cp {} release-assets/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
