name: Deploy Web to Cloudflare Pages

# Builds the WebAssembly web client (Go tailcat bridge + Rust service + VanJS UI)
# from source and deploys it to Cloudflare Pages. The built WASM artifacts
# are no longer committed to dist/; CI always builds them fresh so web
# source changes (apps/web, crates, ui, tailcat) deploy automatically.
on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'apps/web/**'
      - 'tailcat/**'
      - 'vendor/**'
      - 'dist/**'
      - 'functions/**'
      - 'cloudflare/**'
      - 'web-ui/**'
      - 'scripts/build_web_ui.sh'
      - 'scripts/write_web_update_config.mjs'
      - 'scripts/write_web_update_manifest.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build WASM & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply Tailcat Patches
        run: ./scripts/apply_tailcat_patches.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: tailcat/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check WebView UI bundles
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build VanJS WebView UI
        run: ./scripts/build_web_ui.sh

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install wasm-bindgen-cli
        # Cargo.lock is not committed, so resolve the CLI version from the
        # dependency graph to keep the binary and crate schema in sync.
        run: |
          VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | sort -u | head -n 1)
          echo "Installing wasm-bindgen-cli $VERSION"
          echo "WASM_BINDGEN_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install wasm-bindgen-cli binary
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      - name: Build Go Tailcat WASM Bridge
        run: |
          # Build tags are extracted from scripts/update_tailcat.sh
          # (WasmTags from tailcat/pkg/tailcat/internal/buildtags.WasmTags())
          # so CI and local builds always stay in sync.
          WASM_TAGS=$(sed -n 's/^WASM_TAGS="\(.*\)"$/\1/p' scripts/update_tailcat.sh)
          echo "Using WASM_TAGS: $WASM_TAGS"
          mkdir -p dist/assets
          (cd tailcat && GOOS=js GOARCH=wasm go build -trimpath -tags "$WASM_TAGS" -ldflags "-s -w" -o ../dist/assets/tailcat.wasm ./bridge/web/main.go)

          echo "Optimizing tailcat.wasm with wasm-opt -Oz..."
          npx --yes wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext dist/assets/tailcat.wasm -o dist/assets/tailcat.wasm

          gzip -9 -c dist/assets/tailcat.wasm > dist/assets/tailcat.wasm.gz
          du -h dist/assets/tailcat.wasm dist/assets/tailcat.wasm.gz

          # Cloudflare Pages rejects a single asset larger than 25 MiB. The
          # raw Go runtime is currently larger than that limit, while the
          # gzip artifact is well below it and is the browser's normal load
          # path. Keep the raw file in the build workspace for local checks,
          # but do not upload it or include it in the signed release manifest.
          rm -f dist/assets/tailcat.wasm

      - name: Refresh wasm_exec.js
        run: |
          # Ship the wasm_exec.js matching the Go toolchain used above.
          if [ -f "$(go env GOROOT)/lib/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/assets/wasm_exec.js
          else
            cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" dist/assets/wasm_exec.js
          fi

      - name: Build Rust Web Service
        run: |
          cargo build -p tailsend-web --target wasm32-unknown-unknown --release
          rm -rf dist/wasm
          mkdir -p dist/wasm
          wasm-bindgen --target web --out-dir dist/wasm target/wasm32-unknown-unknown/release/tailsend_web.wasm
          gzip -9 -c dist/wasm/tailsend_web_bg.wasm > dist/wasm/tailsend_web_bg.wasm.gz
          du -h dist/wasm/tailsend_web_bg.wasm dist/wasm/tailsend_web_bg.wasm.gz

      - name: Install VanJS UI into the Pages root
        run: |
          # Keep legal/static files already in dist while installing the
          # Vite WebView entry point.
          cp -R web-ui/dist/web/. dist/

      - name: Configure signed browser updates
        env:
          PONLET_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.PONLET_UPDATE_PRIVATE_KEY_PEM }}
          PONLET_UPDATE_MANIFEST_URL: ${{ vars.PONLET_UPDATE_MANIFEST_URL }}
          PONLET_UPDATE_SIGNATURE_URL: ${{ vars.PONLET_UPDATE_SIGNATURE_URL }}
          PONLET_UPDATE_PUBLIC_KEY_JWK: ${{ vars.PONLET_UPDATE_PUBLIC_KEY_JWK }}
          PONLET_UPDATE_FILE_BASE_URL: ${{ vars.PONLET_UPDATE_FILE_BASE_URL }}
          PONLET_UPDATE_DISTRIBUTION: ${{ vars.PONLET_UPDATE_DISTRIBUTION }}
          PONLET_UPDATE_TARGET: ${{ vars.PONLET_UPDATE_TARGET }}
          PONLET_UPDATE_API_VERSION: ${{ vars.PONLET_UPDATE_API_VERSION }}
          PONLET_UPDATE_CURRENT_REVISION: ${{ github.run_number }}
        run: node scripts/write_web_update_config.mjs dist/ponlet-update-config.js

      - name: Create signed browser release manifest
        env:
          PONLET_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.PONLET_UPDATE_PRIVATE_KEY_PEM }}
          PONLET_UPDATE_RELEASE_ID: ${{ github.sha }}
          PONLET_UPDATE_REVISION: ${{ github.run_number }}
          PONLET_UPDATE_DISTRIBUTION: web
          PONLET_UPDATE_TARGET: browser
          PONLET_UPDATE_API_VERSION: '2'
        run: node scripts/write_web_update_manifest.mjs dist

      - name: Verify WASM Sizes (Cloudflare 25 MiB limit)
        run: |
          set -e
          for f in dist/assets/tailcat.wasm.gz dist/wasm/tailsend_web_bg.wasm.gz; do
            SIZE=$(stat -c%s "$f")
            LIMIT=$((25 * 1024 * 1024))
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$f is $SIZE bytes, exceeding the 25 MiB Cloudflare Pages limit"
              exit 1
            fi
            echo "OK: $f is $SIZE bytes"
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=mktailcatsend --commit-dirty=true
