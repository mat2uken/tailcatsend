name: iOS TestFlight Deployment

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  testflight:
    name: Build and upload Tauri iOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Apply Tailcat patches
        run: ./scripts/apply_tailcat_patches.sh

      - name: Setup Go and Rust
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: tailcat/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Select Xcode and install XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.10.0 --locked

      # Certificate/profile installation is kept in the CI secret store. The
      # Tauri CLI consumes APPLE_* signing variables when creating the IPA.
      - name: Install Apple signing material
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-keychain-pass' }}
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64"
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          TEAM_ID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract TeamIdentifier.0 raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "APPLE_DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_CERTIFICATE_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
          echo "IOS_CERTIFICATE=$RUNNER_TEMP/certificate.p12" >> "$GITHUB_ENV"
          echo "IOS_MOBILE_PROVISION=$RUNNER_TEMP/profile.mobileprovision" >> "$GITHUB_ENV"

      - name: Build IPA with Tauri
        run: ./scripts/build_tauri_mobile.sh ios release

      - name: Locate IPA
        run: |
          IPA=$(find apps/tauri/gen/apple/build -type f -name '*.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" ponlet.ipa
          ls -lh ponlet.ipa

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file ponlet.ipa --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ponlet-iOS-IPA
          path: ponlet.ipa
          retention-days: 14
