name: iOS TestFlight Deployment

on:
  workflow_dispatch:
    inputs:
      verify_build:
        description: Existing CFBundleVersion to verify without building or uploading
        type: string
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  testflight:
    if: github.event_name != 'workflow_dispatch' || inputs.verify_build == ''
    name: Build and upload Tauri iOS app
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go and Rust
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: tailcat/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Select Xcode 26 and install XcodeGen
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1 || true)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          brew install xcodegen
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.10.0 --locked

      - name: Set monotonic iOS build number
        run: ./scripts/set_ci_build_number.sh PONLET_IOS_BUILD_NUMBER
      - name: Install Apple signing material
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_SHARE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_SHARE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-keychain-pass' }}
        run: ./scripts/setup_ios_signing.sh

      - name: Build IPA with Tauri
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        run: ./scripts/build_tauri_mobile.sh ios release

      - name: Upload native symbols to Crashlytics
        run: ./scripts/upload_ios_crashlytics_symbols.sh

      - name: Locate IPA
        run: |
          IPA=$(find apps/tauri/gen/apple/build -type f -name '*.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" ponlet.ipa
          ls -lh ponlet.ipa

      - name: Prepare App Store Connect processing verification
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-processing"
          "$RUNNER_TEMP/asc-processing/bin/python" -m pip install 'PyJWT==2.10.1' 'cryptography==46.0.5'
          "$RUNNER_TEMP/asc-processing/bin/python" -m unittest discover -s scripts/tests -p 'test_wait_testflight_processing.py'

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file ponlet.ipa --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Verify TestFlight processing reaches VALID
        timeout-minutes: 21
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          "$RUNNER_TEMP/asc-processing/bin/python" scripts/wait_testflight_processing.py \
            --version-config apps/tauri/tauri.conf.json \
            --ipa ponlet.ipa

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ponlet-iOS-IPA
          path: ponlet.ipa
          retention-days: 14

  verify-existing-build:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_build != ''
    name: Verify existing TestFlight build processing
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Prepare processing verification
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-processing"
          "$RUNNER_TEMP/asc-processing/bin/python" -m pip install 'PyJWT==2.10.1' 'cryptography==46.0.5'
          "$RUNNER_TEMP/asc-processing/bin/python" -m unittest discover -s scripts/tests -p 'test_wait_testflight_processing.py'
      - name: Verify TestFlight processing reaches VALID
        timeout-minutes: 21
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          VERIFY_BUILD: ${{ inputs.verify_build }}
        run: |
          "$RUNNER_TEMP/asc-processing/bin/python" scripts/wait_testflight_processing.py \
            --version-config apps/tauri/tauri.conf.json \
            --build-number "$VERIFY_BUILD"
