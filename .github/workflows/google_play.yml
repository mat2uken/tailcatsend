name: Android Google Play Deployment

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play release track
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
  push:
    tags: ["v*"]

jobs:
  build-and-deploy:
    name: Build Tauri Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Apply Tailcat patches
        run: ./scripts/apply_tailcat_patches.sh

      - name: Setup Java, Go, Node, and Rust
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: tailcat/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b

      - name: Install Android signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/ponlet-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          STORE_PASSWORD=""
          for candidate in "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" android changeit; do
            if [ -n "$candidate" ] && keytool -list -keystore "$KEYSTORE_PATH" -storepass "$candidate" >/dev/null 2>&1; then
              STORE_PASSWORD="$candidate"
              break
            fi
          done
          test -n "$STORE_PASSWORD"
          KEY_ALIAS="$ANDROID_KEY_ALIAS"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            KEY_ALIAS=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')
          fi
          test -n "$KEY_ALIAS"
          KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          if ! keytool -exportcert -rfc -alias "$KEY_ALIAS" -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/ponlet-cert.pem" >/dev/null 2>&1; then
            KEY_PASSWORD="$STORE_PASSWORD"
          fi
          {
            echo "PONLET_ANDROID_KEYSTORE=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.10.0 --locked

      - name: Build signed application bundle input
        env:
          PONLET_ANDROID_ARTIFACT: aab
        run: ./scripts/build_tauri_mobile.sh android release

      - name: Locate App Bundle
        run: |
          AAB=$(find apps/tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)
          test -n "$AAB"
          cp "$AAB" ponlet-release.aab
          ls -lh ponlet-release.aab

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ponlet-Android-AAB
          path: ponlet-release.aab
          retention-days: 30

      - name: Deploy to Google Play
        if: env.PLAY_CONFIG_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: jp.yasagure.ponlet
          releaseFiles: ponlet-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
