name: Android Google Play Deployment

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play release track
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
  push:
    tags: ["v*"]

jobs:
  build-and-deploy:
    name: Build Tauri Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Apply Tailcat patches
        run: |
          git -C tailcat/pkg/tailcat apply --ignore-space-change --ignore-whitespace ../../patches/0001-android-selinux-netmon-fallback.patch || true
          git -C tailcat/pkg/tailscale.com apply --ignore-space-change --ignore-whitespace ../../patches/0002-tailscale-webrtc-transport.patch || true

      - name: Setup Java, Go, Node, and Rust
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: tailcat/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.10.0 --locked

      - name: Build signed application bundle input
        env:
          PONLET_ANDROID_ARTIFACT: aab
        run: ./scripts/build_tauri_mobile.sh android release

      - name: Locate App Bundle
        run: |
          AAB=$(find apps/tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)
          test -n "$AAB"
          cp "$AAB" ponlet-release.aab
          ls -lh ponlet-release.aab

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ponlet-Android-AAB
          path: ponlet-release.aab
          retention-days: 30

      - name: Deploy to Google Play
        if: env.PLAY_CONFIG_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: jp.yasagure.ponlet
          releaseFiles: ponlet-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
