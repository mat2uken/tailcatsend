name: Android Signed Validation or Explicit Play Deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify signed build only; deploy requires separate explicit confirmation
        required: true
        type: choice
        default: verify
        options: [verify, deploy]
      expected_source_sha:
        description: Exact full checkout SHA for verification (versionCode fixed at 2030000102)
        required: false
        type: string
      confirm_deploy:
        description: Explicitly authorize Play deployment (leave false for verification)
        required: true
        type: boolean
        default: false
      track:
        description: Google Play release track
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      previous_version_code:
        description: Highest versionCode currently present in Play Console across ALL tracks (required for deploy)
        required: false
        type: string

permissions:
  contents: read

# One Play upload at a time. Queued/old runs still require a freshly checked
# Console maximum; run_number alone cannot establish order across workflows.
concurrency:
  group: ponlet-google-play-deployment
  cancel-in-progress: false

jobs:
  validate-request:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Reject unsafe mode, source, confirmation, or debug logging
        env:
          VALIDATION_MODE: ${{ inputs.mode }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
          RUNNER_DEBUG: ${{ runner.debug }}
        run: python3 scripts/signed_android_validation.py --check-request

  signed-validation:
    needs: validate-request
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true, persist-credentials: false }
      - name: Confirm checkout and disabled debug logging before tool setup
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          RUNNER_DEBUG: ${{ runner.debug }}
        run: python3 scripts/signed_android_validation.py --check-source
      - name: Test validation safety controls without credentials
        run: |
          python3 -m unittest discover -s scripts/tests -p test_signed_android_validation.py -v
          python3 -m unittest discover -s scripts/tests -p test_tailcat_patch_idempotence.py -v
      - uses: actions/setup-java@v5
        with: { java-version: "17", distribution: temurin }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r28b, local-cache: false }
      - run: cargo install tauri-cli --version 2.10.0 --locked
      - name: Opaque signing, Firebase release build, and static verification only
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          RUNNER_DEBUG: ${{ runner.debug }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/signed_android_validation.py
      - name: Clean only validation-owned private inputs after success or cancellation
        if: always()
        run: python3 scripts/signed_android_validation.py --cleanup-owned
      # No Play credential, artifact/cache upload, Release, app install, or runtime network.

  build-and-deploy:
    needs: validate-request
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' && inputs.confirm_deploy == true
    name: Build Tauri Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Check version code against confirmed Console maximum
        env:
          PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
        run: python3 scripts/android_version_code.py --run-number "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT" --previous "$PREVIOUS_VERSION_CODE" --github-env "$GITHUB_ENV"

      - name: Require Play deployment credentials
        run: test -n "$PLAY_CONFIG_JSON"

      - name: Setup Java, Go, Node, and Rust
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: tailcat/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          # The runner image no longer provides the deprecated "tools" package
          # and sdkmanager exits with an error when it is requested.
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b

      - name: Install Android signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/setup_android_signing.sh

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.10.0 --locked

      - name: Restore Firebase client configuration (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/tauri/gen/android/app/google-services.json
          else
            echo "::notice::Firebase client configuration is absent; telemetry will stay inactive."
          fi

      - name: Build signed application bundle input
        env:
          PONLET_ANDROID_ARTIFACT: aab
          CARGO_PROFILE_RELEASE_STRIP: none
        run: ./scripts/build_tauri_mobile.sh android release

      - name: Locate App Bundle
        run: |
          AAB=$(find apps/tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)
          test -n "$AAB"
          cp "$AAB" ponlet-release.aab
          ls -lh ponlet-release.aab

      - name: Validate signed AAB before GitHub artifact or Play upload
        run: |
          python3 scripts/verify_android_artifacts.py ponlet-release.aab \
            --report "$RUNNER_TEMP/android-play-verification.json" \
            --require-camera-optional --require-no-ad-id --require-received-cloud-excluded \
            --expect-version-code "$PONLET_ANDROID_VERSION_CODE"
          cat "$RUNNER_TEMP/android-play-verification.json"

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ponlet-Android-AAB
          path: ponlet-release.aab
          retention-days: 30

      - name: Recheck built version code before Play upload
        env:
          PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
        run: python3 scripts/android_version_code.py --candidate "$PONLET_ANDROID_VERSION_CODE" --previous "$PREVIOUS_VERSION_CODE"

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: jp.yasagure.ponlet
          releaseFiles: ponlet-release.aab
          tracks: ${{ inputs.track }}
          status: completed
