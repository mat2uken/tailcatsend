name: Android Google Play Deployment

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production
      version_name:
        description: 'App Version Name (e.g. 1.0.0; leave empty to auto-detect from tag or use 1.0.0)'
        required: false
        default: ''
      version_code:
        description: 'App Version Code (leave empty for automatic github.run_number)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build AAB & Deploy to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply Tailcat Patches
        run: |
          if [ -f tailcat/patches/0001-android-selinux-netmon-fallback.patch ]; then
            git -C tailcat/pkg/tailcat apply ../../patches/0001-android-selinux-netmon-fallback.patch
          fi
          if [ -f tailcat/patches/0002-tailscale-webrtc-transport.patch ]; then
            git -C tailcat/pkg/tailscale.com apply ../../patches/0002-tailscale-webrtc-transport.patch
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tailcat/go.sum

      - name: Setup Android SDK Platforms
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.keystore
          ls -la /tmp/keystore/release.keystore

      - name: Build Go Tailcat Android Shared Library
        run: |
          export CC=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          export CXX=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++
          mkdir -p target target/aarch64-linux-android/release
          (cd tailcat/bridge/native && CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -ldflags="-checklinkname=0" -buildmode=c-shared -o ../../../target/libtailcat_android.so bridge.go)
          cp target/libtailcat_android.so target/aarch64-linux-android/release/libtailcat_android.so

      - name: Build Rust Android Native Library
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          export CLANG_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG_BIN/aarch64-linux-android33-clang
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$CLANG_BIN/llvm-ar
          export CC_aarch64_linux_android=$CLANG_BIN/aarch64-linux-android33-clang
          export CXX_aarch64_linux_android=$CLANG_BIN/aarch64-linux-android33-clang++
          # release-native profile keeps ELF symbols for Crashlytics NDK symbol upload
          cargo build -p tailsend-android --target aarch64-linux-android --lib --profile release-native

      - name: Prepare JNI Libraries for Gradle
        run: |
          JNI_DIR=apps/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI_DIR"
          cp target/aarch64-linux-android/release-native/libtailsend_android.so "$JNI_DIR/"
          cp target/libtailcat_android.so "$JNI_DIR/"
          ls -lh "$JNI_DIR"

      - name: Restore google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/android/app/google-services.json
            echo "google-services.json restored from secret; Firebase telemetry enabled."
          else
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 is not set. Building without google-services.json; google-services/crashlytics plugins are skipped and telemetry stays disabled."
          fi

      - name: Configure Version Codes & Release Parameters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then
            if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" =~ ^v ]]; then
              VERSION_NAME="${GITHUB_REF_NAME#v}"
            else
              VERSION_NAME="1.0.0"
            fi
          fi

          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$VERSION_CODE" ]; then
            TODAY_YMD=$(TZ='Asia/Tokyo' date +'%Y%m%d')
            NN=$(printf "%02d" "$(( GITHUB_RUN_NUMBER % 100 ))")
            VERSION_CODE="${TODAY_YMD}${NN}"
          fi

          TRACK="${{ github.event.inputs.track || 'internal' }}"
          if [ -z "$TRACK" ]; then
            TRACK="internal"
          fi

          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "TRACK=$TRACK"
          } >> "$GITHUB_ENV"

          echo "Building Ponlet version: $VERSION_NAME (VersionCode: $VERSION_CODE, Track: $TRACK)"

          if [ -n "$PLAY_CONFIG_JSON" ]; then
            echo "Google Play service account JSON secret is configured."
          else
            echo "::notice::PLAY_CONFIG_JSON secret is not set. Google Play Console deployment step will be skipped."
          fi

      - name: Build Android App Bundle (AAB) with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p apps/android :app:bundleRelease \
            -PKEYSTORE_FILE=/tmp/keystore/release.keystore \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            --no-daemon --stacktrace

          ls -lh apps/android/app/build/outputs/bundle/release/

      - name: Copy AAB to root for easy artifact upload
        run: |
          cp apps/android/app/build/outputs/bundle/release/app-release.aab ./ponlet-release.aab

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ponlet-Android-AAB
          path: ponlet-release.aab
          retention-days: 30

      - name: Deploy to Google Play Console
        if: env.PLAY_CONFIG_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: jp.yasagure.ponlet
          releaseFiles: ponlet-release.aab
          track: ${{ env.TRACK }}
          status: completed

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -rf /tmp/keystore
