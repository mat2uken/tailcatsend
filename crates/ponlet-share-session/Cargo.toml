[package]
name = "ponlet-share-session"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
native-interop-tests = []

[[test]]
name = "native_interop"
required-features = ["native-interop-tests"]

[dependencies]
async-trait = { workspace = true }
rand = { workspace = true }
